<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" type="image/png" href="/BadTherapist/images/logo.png?v=2">
    <title>Settings | Bad Therapist</title>


    <script src="audio-manager.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #080808;
            --dark: #111;
            --gray: #777;
            --light: #ccc;
            --white: #f2f2f2;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(ellipse at center, #202020 0%, #101010 55%, #080808 100%);
            color: var(--white);
            font-family: 'VT323', monospace;
            font-size: 22px;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 2px,
                rgba(0, 0, 0, 0.22) 3px,
                rgba(0, 0, 0, 0.22) 4px
            );
        }

        .page {
            width: min(700px, 90%);
            margin: 0 auto;
            padding: 35px 0 60px;
        }

        header {
            margin-bottom: 55px;
        }

        .back {
            color: var(--gray);
            text-decoration: none;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            transition: color 0.2s;
        }

        .back:hover {
            color: var(--white);
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(22px, 5vw, 34px);
            text-align: center;
            margin-bottom: 45px;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0 #555;
        }

        .section {
            margin-bottom: 35px;
            padding: 22px;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid #444;
            position: relative;
        }

        .section::before,
        .section::after {
            content: "";
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--light);
        }

        .section::before {
            top: -1px;
            left: -1px;
        }

        .section::after {
            bottom: -1px;
            right: -1px;
        }

        h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            margin-bottom: 25px;
            color: var(--light);
        }

        .control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .control:last-child {
            margin-bottom: 0;
        }

        label {
            color: var(--light);
        }

        input[type="range"] {
            width: 180px;
            accent-color: var(--white);
            cursor: pointer;
        }

        button,
        .link-button {
            display: inline-block;
            padding: 10px 15px;
            border: 1px solid #888;
            background: transparent;
            color: var(--white);
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover,
        .link-button:hover {
            background: var(--white);
            color: var(--black);
            border-color: var(--white);
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .danger {
            border-color: #777;
            color: #aaa;
        }

        .danger:hover {
            background: #aaa;
            color: #080808;
            border-color: #aaa;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .links a {
            color: var(--light);
            text-decoration: none;
            width: fit-content;
            transition: color 0.2s;
        }

        .links a:hover {
            color: var(--white);
            text-decoration: underline;
        }

        input[type="file"] {
            display: none;
        }

        @media (max-width: 500px) {
            .page {
                padding-top: 25px;
            }

            header {
                margin-bottom: 45px;
            }

            .section {
                padding: 18px;
            }

            .control {
                align-items: flex-start;
                flex-direction: column;
            }

            input[type="range"] {
                width: 100%;
            }

            button,
            .link-button {
                font-size: 8px;
            }
        }
    </style>
</head>

<body>

    <audio id="intro-music" src="audio/intro.mp3" loop preload="auto"></audio>

    <div class="page">

        <header>
            <a class="back" id="back-link" href="index.html">← BACK</a>
        </header>

        <main>
            <h1>SETTINGS</h1>

            <section class="section">
                <h2>AUDIO</h2>

                <div class="control">
                    <label for="volume">VOLUME</label>
                    <input type="range" id="volume" min="0" max="100" value="70">
                </div>

                <div class="control">
                    <label for="mute">MUTE</label>
                    <button id="mute" type="button">OFF</button>
                </div>
            </section>

            <section class="section">
                <h2>SAVE DATA</h2>

                <div class="button-group">
                    <button id="export" type="button">EXPORT</button>
                    <button id="import-button" type="button">IMPORT</button>
                    <input type="file" id="import-file" accept=".json,application/json">
                </div>
            </section>

            <section class="section">
                <h2>RESET</h2>

                <button class="danger" id="reset" type="button">
                    RESET DATA
                </button>
            </section>

            <section class="section">
                <h2>INFORMATION</h2>

                <div class="links">
                    <a href="credit.html">CREDITS / INFORMATION / HOW TO PLAY →</a>
                </div>
            </section>

            <section class="section">
                <h2>EXTERNAL LINKS</h2>

                <div class="links">
                  <a href="#" id="share-game">SHARE GAME ↗</a>

                    <a href="https://youtube.com/@krismeowofficial?si=qd-ctk7MqisbWY7w" target="_blank" rel="noopener noreferrer">
                        YOUTUBE ↗
                    </a>
                </div>
            </section>
        </main>
    </div>

    <script>
        const LS_KEY = 'lmtd_save_v3';
        const LS_VOL_KEY = 'lmtd_volume';
        const LS_MUTE_KEY = 'lmtd_muted';
        const CH_LS_CHAPTERS = 'lmtd_chapters_v1';
        const CH_LS_ENDINGS_SEEN = 'lmtd_endings_seen_v1';
        const SESSION_CODE_KEY = 'lmtd_code_ok';
        const GAME_FLAGS_KEY = 'lmtd_gameFlags';
        const PLAYER_KEY = 'bt_player_state';   // sauvegarde de position du jeu 3D

        const volumeInput = document.getElementById('volume');
        const muteButton = document.getElementById('mute');
        const importFile = document.getElementById('import-file');

        // BACK BUTTON
        const params = new URLSearchParams(window.location.search);

        document.getElementById('back-link').href =
            params.get('from') === 'world_base'
                ? 'world_base.html'
                : 'index.html';

        // AUDIO SETTINGS
        let volume = Number(localStorage.getItem(LS_VOL_KEY) ?? 0.7);
        let muted = localStorage.getItem(LS_MUTE_KEY) === '1';

        if (!Number.isFinite(volume)) volume = 0.7;

        volume = Math.max(0, Math.min(1, volume));

        volumeInput.value = Math.round(volume * 100);
        muteButton.textContent = muted ? 'ON' : 'OFF';

        volumeInput.addEventListener('input', () => {
            volume = Number(volumeInput.value) / 100;

            localStorage.setItem(LS_VOL_KEY, String(volume));

            if (window.BadTherapistAudio) {
                window.BadTherapistAudio.setVolume(volume);
            }
        });

        muteButton.addEventListener('click', () => {
            muted = !muted;

            localStorage.setItem(LS_MUTE_KEY, muted ? '1' : '0');

            muteButton.textContent = muted ? 'ON' : 'OFF';

            if (window.BadTherapistAudio) {
                window.BadTherapistAudio.setMuted(muted);
            }
        });

        // EXPORT SAVE DATA
        document.getElementById('export').addEventListener('click', () => {
            const data = {
                save: localStorage.getItem(LS_KEY) || '',
                volume: localStorage.getItem(LS_VOL_KEY) || '0.7',
                muted: localStorage.getItem(LS_MUTE_KEY) || '0',
                chapters: localStorage.getItem(CH_LS_CHAPTERS) || '[]',
                endings: localStorage.getItem(CH_LS_ENDINGS_SEEN) || '[]',
                gameFlags: localStorage.getItem(GAME_FLAGS_KEY) || '{}',
                player: localStorage.getItem(PLAYER_KEY) || ''
            };

            const blob = new Blob(
                [JSON.stringify(data, null, 2)],
                { type: 'application/json' }
            );

            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');

            link.href = url;
            link.download = 'bad-therapist-save.json';
            link.click();

            URL.revokeObjectURL(url);
        });

        // IMPORT SAVE DATA
        document.getElementById('import-button').addEventListener('click', () => {
            importFile.click();
        });

        importFile.addEventListener('change', async () => {
            const file = importFile.files[0];

            if (!file) return;

            try {
                const text = await file.text();
                const data = JSON.parse(text);

                if (!data || typeof data !== 'object' || Array.isArray(data)) {
                    throw new Error('Invalid save file');
                }

                if (!window.confirm('Import this save file? Current progress may be overwritten.')) {
                    importFile.value = '';
                    return;
                }

                if (typeof data.save === 'string') {
                    localStorage.setItem(LS_KEY, data.save);
                }

                if (data.volume !== undefined) {
                    localStorage.setItem(LS_VOL_KEY, String(data.volume));
                }

                if (data.muted !== undefined) {
                    localStorage.setItem(LS_MUTE_KEY, String(data.muted));
                }

                if (typeof data.chapters === 'string') {
                    localStorage.setItem(CH_LS_CHAPTERS, data.chapters);
                }

                if (typeof data.endings === 'string') {
                    localStorage.setItem(CH_LS_ENDINGS_SEEN, data.endings);
                }

                if (typeof data.gameFlags === 'string') {
                    localStorage.setItem(GAME_FLAGS_KEY, data.gameFlags);
                }

                if (typeof data.player === 'string' && data.player) {
                    // Position du joueur : on vérifie que c'est bien un JSON valide
                    try {
                        const parsed = JSON.parse(data.player);
                        if (parsed && typeof parsed === 'object' && parsed.worlds) {
                            localStorage.setItem(PLAYER_KEY, data.player);
                        }
                    } catch (e) { /* ignoré */ }
                }

                alert('Save imported successfully.');
                location.reload();

            } catch (error) {
                alert('Invalid save file.');
            }

            importFile.value = '';
        });

        // RESET DATA
        document.getElementById('reset').addEventListener('click', () => {
            const confirmed = window.confirm(
                'Are you sure you want to reset all game data? This action cannot be undone.'
            );

            if (!confirmed) return;

            [
                LS_KEY,
                LS_VOL_KEY,
                LS_MUTE_KEY,
                CH_LS_CHAPTERS,
                CH_LS_ENDINGS_SEEN,
                GAME_FLAGS_KEY,
                PLAYER_KEY
            ].forEach(key => localStorage.removeItem(key));

            sessionStorage.removeItem(SESSION_CODE_KEY);

            location.reload();
        });

        // SHARE GAME
document.getElementById('share-game').addEventListener('click', async (event) => {
    event.preventDefault();

    const gameUrl = 'https://pioupioucoder.github.io/BadTherapist/';

    try {
        if (navigator.share) {
            await navigator.share({
                title: 'Bad Therapist',
                url: gameUrl
            });
        } else {
            await navigator.clipboard.writeText(gameUrl);
            alert('Game link copied to clipboard!');
        }
    } catch (error) {
        if (error.name !== 'AbortError') {
            alert('Could not share the link.');
        }
    }
});
    </script>

</body>
</html>
