<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" type="image/png" href="/BadTherapist/images/logo.png?v=2">
    <title>Settings | Bad Therapist</title>


    <script src="save-data.js"></script>
<script type="module" src="therapist-memory.js"></script>
<script src="audio-manager.js" defer></script>
<script src="loader.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #080808;
            --dark: #111;
            --gray: #777;
            --light: #ccc;
            --white: #f2f2f2;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(ellipse at center, #202020 0%, #101010 55%, #080808 100%);
            color: var(--white);
            font-family: 'VT323', monospace;
            font-size: 22px;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 2px,
                rgba(0, 0, 0, 0.22) 3px,
                rgba(0, 0, 0, 0.22) 4px
            );
        }

        .page {
            width: min(700px, 90%);
            margin: 0 auto;
            padding: 35px 0 60px;
        }

        header {
            margin-bottom: 55px;
        }

        .back {
            color: var(--gray);
            text-decoration: none;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            transition: color 0.2s;
        }

        .back:hover {
            color: var(--white);
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(22px, 5vw, 34px);
            text-align: center;
            margin-bottom: 45px;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0 #555;
        }

        .section {
            margin-bottom: 35px;
            padding: 22px;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid #444;
            position: relative;
        }

        .section::before,
        .section::after {
            content: "";
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--light);
        }

        .section::before {
            top: -1px;
            left: -1px;
        }

        .section::after {
            bottom: -1px;
            right: -1px;
        }

        h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            margin-bottom: 25px;
            color: var(--light);
        }

        .control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .control:last-child {
            margin-bottom: 0;
        }

        label {
            color: var(--light);
        }

        input[type="range"] {
            width: 180px;
            accent-color: var(--white);
            cursor: pointer;
        }

        button,
        .link-button {
            display: inline-block;
            padding: 10px 15px;
            border: 1px solid #888;
            background: transparent;
            color: var(--white);
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover,
        .link-button:hover {
            background: var(--white);
            color: var(--black);
            border-color: var(--white);
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .danger {
            border-color: #777;
            color: #aaa;
        }

        .danger:hover {
            background: #aaa;
            color: #080808;
            border-color: #aaa;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .links a {
            color: var(--light);
            text-decoration: none;
            width: fit-content;
            transition: color 0.2s;
        }

        .links a:hover {
            color: var(--white);
            text-decoration: underline;
        }

        input[type="file"] {
            display: none;
        }

        [hidden] {
            display: none !important;
        }


        .hint {
            margin-top: 16px;
            color: var(--gray);
            font-size: 18px;
            line-height: 1.2;
        }

        @media (max-width: 500px) {
            .page {
                padding-top: 25px;
            }

            header {
                margin-bottom: 45px;
            }

            .section {
                padding: 18px;
            }

            .control {
                align-items: flex-start;
                flex-direction: column;
            }

            input[type="range"] {
                width: 100%;
            }

            button,
            .link-button {
                font-size: 8px;
            }
        }
    </style>
</head>

<body>

    <audio id="intro-music" src="audio/intro.mp3" loop preload="auto"></audio>

    <div class="page">

        <header>
            <a class="back" id="back-link" href="index.html">← BACK</a>
        </header>

        <main>
            <h1>SETTINGS</h1>

            <section class="section">
                <h2>AUDIO</h2>

                <div class="control">
                    <label for="volume">VOLUME</label>
                    <input type="range" id="volume" min="0" max="100" value="70">
                </div>

                <div class="control">
                    <label for="mute">MUTE</label>
                    <button id="mute" type="button">OFF</button>
                </div>
            </section>

            <section class="section" id="player-save-section">
                <h2>SAVE DATA</h2>

                <div class="button-group">
                    <button id="export" type="button">EXPORT</button>
                    <button id="import-button" type="button">IMPORT</button>
                    <input type="file" id="import-file" accept=".json,application/json">
                </div>
            </section>

            <section class="section" id="admin-sync-section" hidden>
                <h2>CLOUD SYNC</h2>

                <div id="sync-signed-out" hidden>
                    <div class="button-group">
                        <button id="sync-signin" type="button">SIGN IN WITH GOOGLE</button>
                    </div>
                </div>

                <div id="sync-signed-in" hidden>
                    <div class="button-group">
                        <button id="sync-now" type="button">SYNC NOW</button>
                        <button id="sync-signout" class="danger" type="button">SIGN OUT</button>
                    </div>
                </div>

                <p class="hint" id="sync-status"></p>
            </section>

            <section class="section" id="reset-section">
                <h2>RESET</h2>

                <button class="danger" id="reset" type="button">
                    RESET DATA
                </button>
            </section>

            <section class="section" id="update-section" hidden>
                <h2>UPDATE</h2>

                <button id="update-version" type="button">UPDATE VERSION</button>
                <p class="hint" id="update-status"></p>
            </section>

            <section class="section">
                <h2>INFORMATION</h2>

                <div class="links">
                    <a href="credit.html">CREDITS / INFORMATION / HOW TO PLAY →</a>
                </div>
            </section>

            <section class="section">
                <h2>EXTERNAL LINKS</h2>

                <div class="links">
                  <a href="#" id="share-game">SHARE GAME ↗</a>

                    <a href="https://youtube.com/@krismeowofficial?si=qd-ctk7MqisbWY7w" target="_blank" rel="noopener noreferrer">
                        YOUTUBE ↗
                    </a>
                </div>
            </section>
        </main>
    </div>

        <script>
        const LS_VOL_KEY = 'lmtd_volume';
        const LS_MUTE_KEY = 'lmtd_muted';
        const SESSION_CODE_KEY = 'lmtd_code_ok';

        // Tout ce qui s'exporte / s'importe / se remet à zéro est défini dans save-data.js
        const Save = window.BadTherapistSave;

        if (!Save) {
            // save-data.js introuvable : le son marche toujours, seuls EXPORT / IMPORT / RESET sont désactivés
            console.error('save-data.js not found: put it in the same folder as settings.html.');
            ['export', 'import-button', 'reset'].forEach(id => { document.getElementById(id).disabled = true; });
        }

        // Retour depuis le cache de retour arrière : on recharge pour afficher le bon profil
        window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });

        const volumeInput = document.getElementById('volume');
        const muteButton = document.getElementById('mute');
        const importFile = document.getElementById('import-file');

        // BACK BUTTON
        const params = new URLSearchParams(window.location.search);

        document.getElementById('back-link').href =
            params.get('from') === 'world_base'
                ? 'world_base.html'
                : 'index.html';

        // AUDIO SETTINGS
        let volume = Number(localStorage.getItem(LS_VOL_KEY) ?? 0.7);
        let muted = localStorage.getItem(LS_MUTE_KEY) === '1';

        if (!Number.isFinite(volume)) volume = 0.7;

        volume = Math.max(0, Math.min(1, volume));

        volumeInput.value = Math.round(volume * 100);
        muteButton.textContent = muted ? 'ON' : 'OFF';

        volumeInput.addEventListener('input', () => {
            volume = Number(volumeInput.value) / 100;

            localStorage.setItem(LS_VOL_KEY, String(volume));

            if (window.BadTherapistAudio) {
                window.BadTherapistAudio.setVolume(volume);
            }
        });

        muteButton.addEventListener('click', () => {
            muted = !muted;

            localStorage.setItem(LS_MUTE_KEY, muted ? '1' : '0');

            muteButton.textContent = muted ? 'ON' : 'OFF';

            if (window.BadTherapistAudio) {
                window.BadTherapistAudio.setMuted(muted);
            }
        });

        // CLOUD SYNC (profil admin uniquement : à la place d'EXPORT / IMPORT)
        if (Save && Save.activeProfile() === 'admin') {
            document.getElementById('reset-section').hidden = true;      // RESET DATA ne sert à rien pour l'admin
            document.getElementById('update-section').hidden = false;    // : UPDATE VERSION à la place
            const playerSection = document.getElementById('player-save-section');
            const syncSection = document.getElementById('admin-sync-section');
            const signedOutBox = document.getElementById('sync-signed-out');
            const signedInBox = document.getElementById('sync-signed-in');
            const statusEl = document.getElementById('sync-status');

            playerSection.hidden = true;
            syncSection.hidden = false;

            const say = (text) => { statusEl.textContent = text; };

            const errorText = (err) => {
                if (err === 'not-configured') return 'Firebase is not configured yet (see FIREBASE_CONFIG in save-data.js).';
                if (err === 'auth/unauthorized-domain') return 'This site is not an authorized domain in Firebase (Authentication > Settings).';
                if (err === 'auth/popup-closed-by-user' || err === 'auth/cancelled-popup-request') return 'Sign-in cancelled.';
                if (err === 'permission-denied') return 'Access refused. Check the Firestore rules: only your Google account must be allowed.';
                if (err === 'signed-out') return 'You are signed out. Sign in again.';
                return 'Sync failed (' + err + '). Check your connection and try again.';
            };

            const refresh = async () => {
                say('Loading...');
                const st = await Save.syncStatus();
                if (!st.available) {
                    signedOutBox.hidden = true;
                    signedInBox.hidden = true;
                    say(errorText('not-configured'));
                    return;
                }
                signedOutBox.hidden = !!st.user;
                signedInBox.hidden = !st.user;
                if (st.user) say('Signed in as ' + st.user + '. ' + (Save.syncIsDirty() ? 'Changes not sent yet.' : 'Auto sync is on.'));
                else say(st.error ? errorText(st.error) : 'Sign in once with your Google account. It stays signed in on this browser.');
            };
            refresh();

            // Première synchro / synchro manuelle
            const runSync = async () => {
                const button = document.getElementById('sync-now');
                button.disabled = true;
                say('Syncing...');

                try {
                    let res = await Save.syncPush(false);

                    if (res.conflict) {
                        // Le cloud a une autre version que celle vue par ce navigateur
                        if (window.confirm('The cloud save is different from this browser.\n\nOK = DOWNLOAD the cloud save (replaces this browser\'s admin progress).\nCancel = see the other option.')) {
                            res = await Save.syncPull();
                            if (res.ok) { alert('Cloud save loaded.'); location.reload(); return; }
                        } else if (window.confirm('Overwrite the CLOUD with this browser\'s admin save instead?\n\nThe cloud version will be replaced.')) {
                            res = await Save.syncPush(true);
                        } else {
                            say('Nothing changed.');
                            return;
                        }
                    } else if (res.ok && res.nothing) {
                        // Rien en local : on récupère le cloud
                        res = await Save.syncPull();
                        if (res.ok && !res.empty) { alert('Cloud save loaded.'); location.reload(); return; }
                    }

                    say(res.ok ? 'Synced.' : errorText(res.error));
                } finally {
                    button.disabled = false;
                    if (statusEl.textContent === 'Synced.') setTimeout(refresh, 2500);
                }
            };

            document.getElementById('sync-now').addEventListener('click', runSync);

            document.getElementById('sync-signin').addEventListener('click', async () => {
                say('Opening Google sign-in...');
                const res = await Save.syncSignIn();
                if (res.redirect) return;                 // la page est quittée puis revient connectée
                if (!res.ok) { say(errorText(res.error)); return; }
                await refresh();
                runSync();                                // 1re synchro tout de suite
            });

            document.getElementById('sync-signout').addEventListener('click', async () => {
                if (!window.confirm('Sign out? Auto sync stops on this browser. Your local admin save stays as it is.')) return;
                await Save.syncSignOut();
                refresh();
            });
        }

        // EXPORT SAVE DATA
        document.getElementById('export').addEventListener('click', () => {
            const data = Save.collect();
            const profile = Save.activeProfile();
            data.profile = profile;

            const blob = new Blob(
                [JSON.stringify(data, null, 2)],
                { type: 'application/json' }
            );

            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');

            link.href = url;
            // admin : le nom exact à pousser dans json/ ; joueur : un autre nom, pour ne jamais les confondre
            link.download = profile === 'admin' ? 'bad-therapist-save.json' : 'bad-therapist-player-save.json';
            link.click();

            URL.revokeObjectURL(url);

            // Export de la sauvegarde admin : plus rien de « non exporté », l'œil pourra recharger le fichier poussé
            if (Save.activeProfile() === 'admin') Save.markAdminClean();
        });

        // IMPORT SAVE DATA
        document.getElementById('import-button').addEventListener('click', () => {
            importFile.click();
        });

        importFile.addEventListener('change', async () => {
            const file = importFile.files[0];

            if (!file) return;

            try {
                const text = await file.text();
                const data = JSON.parse(text);

                if (!data || typeof data !== 'object' || Array.isArray(data)) {
                    throw new Error('Invalid save file');
                }

                const target = Save.activeProfile();
                const label = target === 'admin' ? 'ADMIN' : 'PLAYER';
                let msg = 'Import this file into the ' + label + ' save? Current ' + label + ' progress will be overwritten.';
                if (data.profile && data.profile !== target) {
                    msg = 'WARNING: this file comes from the ' + data.profile.toUpperCase() + ' save, but you are importing into the ' + label + ' save.\n\n' + msg;
                }

                if (!window.confirm(msg)) {
                    importFile.value = '';
                    return;
                }

                // Sur le profil admin, l'import reste « non exporté » : l'œil ne l'écrasera pas avant un EXPORT
                Save.apply(data);

                alert('Save imported successfully.');
                location.reload();

            } catch (error) {
                alert('Invalid save file.');
            }

            importFile.value = '';
        });

        // RESET DATA
        document.getElementById('reset').addEventListener('click', () => {
            const confirmed = window.confirm(
                'Are you sure you want to reset all game data? This action cannot be undone.'
            );

            if (!confirmed) return;

            Save.resetPlayer();   // remet le profil joueur à zéro ; la sauvegarde admin n'est jamais touchée

            sessionStorage.removeItem(SESSION_CODE_KEY);

            location.reload();
        });

        // UPDATE VERSION : force le navigateur à re-vérifier TOUS les fichiers du jeu auprès du serveur.
        // RESET DATA ne vide que la sauvegarde, jamais le cache du navigateur : c'est lui qui garde les vieux fichiers.
        // Ici : (1) on retire les service workers et le Cache Storage, (2) on parcourt le jeu (HTML, JS, CSS, JSON, TXT) en
        // suivant les imports, et on redemande chaque fichier au serveur avec « no-cache » (réponse 304 si rien n'a changé,
        // nouveau fichier sinon : le cache du navigateur est mis à jour), (3) on recharge avec une adresse neuve.
        // Les sauvegardes (localStorage) ne sont JAMAIS touchées. Les gros fichiers (.glb, .fbx, sons, images) ne sont pas
        // retéléchargés : donne-leur un nouveau nom s'ils changent.
        async function updateVersion(onProgress) {
            const base = document.baseURI;
            const seen = new Set();
            const queue = [];
            let checked = 0, failed = 0, newest = 0;

            const add = (raw, from) => {
                if (!raw || /[${}\s]/.test(raw) || /^(data:|blob:|mailto:|javascript:|#)/.test(raw)) return;
                let u;
                try { u = new URL(raw, from); } catch (e) { return; }
                if (u.origin !== location.origin || !/\.(html|js|mjs|css|json|txt)$/i.test(u.pathname)) return;
                u.hash = '';
                if (seen.has(u.href) || seen.size >= 600) return;
                seen.add(u.href);
                queue.push(u.href);
            };

            const scan = (text, file) => {
                const patterns = [
                    /(?:\bfrom\s*|\bimport\s*\(\s*|\bimport\s+)['"]([^'"]+)['"]/g,
                    /\b(?:src|href)\s*=\s*["']([^"']+)["']/g,
                    /['"`]([\w\-./]+\.(?:js|mjs|css|json|txt|html))['"`]/g
                ];
                patterns.forEach((re) => {
                    let m;
                    while ((m = re.exec(text))) add(m[1], /^\.{1,2}\//.test(m[1]) ? file : base);
                });
            };

            // 1. service workers + Cache Storage (s'il y en a)
            try {
                if ('serviceWorker' in navigator) {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(regs.map((r) => r.unregister()));
                }
                if (window.caches) {
                    const keys = await caches.keys();
                    await Promise.all(keys.map((k) => caches.delete(k)));
                }
            } catch (e) { /* tant pis */ }

            // 2. on part des pages et des scripts déjà présents, puis on suit les imports
            ['index.html', 'settings.html', 'world_base.html', 'credit.html', location.pathname].forEach((p) => add(p, base));
            document.querySelectorAll('script[src], link[href]').forEach((el) => add(el.getAttribute('src') || el.getAttribute('href'), base));

            const visit = async (href) => {
                try {
                    const r = await fetch(href, { cache: 'no-cache' });
                    if (r.ok) {
                        const lm = Date.parse(r.headers.get('Last-Modified') || '');
                        if (lm > newest) newest = lm;
                        const text = await r.text();
                        if (/\.(html|js|mjs|css)$/i.test(new URL(href).pathname)) scan(text, href);
                    } else {
                        failed++;           // fichier facultatif absent (ex. therapist-secret.js) : sans importance
                    }
                } catch (e) {
                    failed++;
                }
                checked++;
                onProgress(checked, seen.size);
            };
            const worker = async () => { while (queue.length) await visit(queue.shift()); };
            await Promise.all([1, 2, 3, 4, 5, 6].map(worker));

            return { checked, failed, newest, offline: checked > 0 && failed === checked };
        }

        // Heure du dernier VRAI push GitHub (= date du fichier le plus récent sur le serveur), pas l'heure de la synchro
        const PUSH_KEY = 'bt_push_info';
        const fmtPush = (ms) => new Date(ms).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        const pushLine = (info) => {
            if (!info || !info.newest) return 'Last push: unknown';
            return 'Last push: ' + fmtPush(info.newest) + (info.isNew === true ? ' (new push!)' : info.isNew === false ? ' (no new push)' : '');
        };
        const readPush = () => { try { return JSON.parse(localStorage.getItem(PUSH_KEY) || 'null'); } catch (e) { return null; } };
        const statusEl2 = document.getElementById('update-status');
        if (readPush()) statusEl2.textContent = pushLine(readPush());

        document.getElementById('update-version').addEventListener('click', async () => {
            const btn = document.getElementById('update-version');
            btn.disabled = true;
            try {
                const res = await updateVersion((done, total) => { btn.textContent = 'CHECKING ' + done + '/' + total + '...'; });
                if (res.offline) {
                    statusEl2.textContent = 'No connection.';
                    btn.textContent = 'UPDATE VERSION';
                    btn.disabled = false;
                    return;
                }
                const prev = readPush();
                const info = { newest: res.newest || (prev && prev.newest) || 0 };
                info.isNew = prev && prev.newest && res.newest ? res.newest > prev.newest : null;   // null = première fois : on ne sait pas
                try { localStorage.setItem(PUSH_KEY, JSON.stringify(info)); } catch (e) { /* rien */ }
                statusEl2.textContent = pushLine(info);
                btn.textContent = 'UPDATED';
                setTimeout(() => { location.replace(location.pathname + '?u=' + Date.now()); }, 1200);
            } catch (e) {
                console.error(e);
                statusEl2.textContent = 'Update failed.';
                btn.textContent = 'UPDATE VERSION';
                btn.disabled = false;
            }
        });

        // SHARE GAME
document.getElementById('share-game').addEventListener('click', async (event) => {
    event.preventDefault();

    const gameUrl = 'https://pioupioucoder.github.io/BadTherapist/';

    try {
        if (navigator.share) {
            await navigator.share({
                title: 'Bad Therapist',
                url: gameUrl
            });
        } else {
            await navigator.clipboard.writeText(gameUrl);
            alert('Game link copied to clipboard!');
        }
    } catch (error) {
        if (error.name !== 'AbortError') {
            alert('Could not share the link.');
        }
    }
});
    </script>

</body>
</html>
