<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credits | Bad Therapist</title>
    <link rel="icon" type="image/png" href="images/logo.png">

    <script src="audio-manager.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #080808;
            --gray: #777;
            --light: #ccc;
            --white: #f2f2f2;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(ellipse at center, #202020 0%, #101010 55%, #080808 100%);
            color: var(--white);
            font-family: 'VT323', monospace;
            font-size: 22px;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 2px,
                rgba(0, 0, 0, 0.22) 3px,
                rgba(0, 0, 0, 0.22) 4px
            );
        }

        .page {
            width: min(700px, 90%);
            margin: 0 auto;
            padding: 35px 0 60px;
        }

        header {
            margin-bottom: 55px;
        }

        .back {
            color: var(--gray);
            text-decoration: none;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            transition: color 0.2s;
        }

        .back:hover {
            color: var(--white);
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(22px, 5vw, 34px);
            text-align: center;
            margin-bottom: 45px;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0 #555;
        }

        .section {
            padding: 25px;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid #444;
            position: relative;
        }

        .section::before,
        .section::after {
            content: "";
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--light);
        }

        .section::before {
            top: -1px;
            left: -1px;
        }

        .section::after {
            bottom: -1px;
            right: -1px;
        }

        h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            margin-bottom: 25px;
            color: var(--light);
        }

        .music-list {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .music-item {
            padding-bottom: 18px;
            border-bottom: 1px solid #333;
        }

        .music-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .song-title {
            display: inline-block;
            color: var(--white);
            text-decoration: none;
            margin-bottom: 5px;
        }

        .song-title:hover {
            color: var(--light);
            text-decoration: underline;
        }

        .artist {
            color: var(--gray);
        }

        a:focus-visible {
            outline: 2px solid var(--white);
            outline-offset: 4px;
        }

        @media (max-width: 500px) {
            .page {
                padding-top: 25px;
            }

            header {
                margin-bottom: 45px;
            }

            .section {
                padding: 18px;
            }

            h2 {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

    <audio id="intro-music" src="audio/intro.mp3" loop preload="auto"></audio>

    <div class="page">

        <header>
            <a class="back" href="settings.html">← BACK</a>
        </header>

        <main>
            <h1>CREDITS</h1>

            <section class="section">
                <h2>MUSIC</h2>

                <div class="music-list">

                    <div class="music-item">
                        <a class="song-title"
                           href="https://soundcloud.com/name_music_channel/halloween-song?si=2560b39ea00a40edb4dd8b6510edc328&amp;utm_source=clipboard&amp;utm_medium=text&amp;utm_campaign=social_sharing"
                           target="_blank"
                           rel="noopener noreferrer"
                           aria-label="Listen to Ghost Land Mystery by Heart of Unicornia on SoundCloud">
                            Ghost Land Mystery ↗
                        </a>
                        <div class="artist">by Heart of Unicornia</div>
                    </div>

                    <div class="music-item">
                        <a class="song-title"
                           href="https://soundcloud.com/name_music_channel/i-made-this-song-without-listening-to-it?si=e07d6aea3a014688a838d9fcb18b7238&amp;utm_source=clipboard&amp;utm_medium=text&amp;utm_campaign=social_sharing"
                           target="_blank"
                           rel="noopener noreferrer"
                           aria-label="Listen to I made this song without listening to it by Heart of Unicornia on SoundCloud">
                            I made this song without listening to it ↗
                        </a>
                        <div class="artist">by Heart of Unicornia</div>
                    </div>

                </div>
            </section>
        </main>

    </div>
</body>
</html>
