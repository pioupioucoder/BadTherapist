* {

.hud-panel {

.panel-close {

<script type="module">

import * as THREE from 'three';

// ==========================================
// 1. SCENE
// ==========================================

const canvas = document.getElementById('gc');

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'low-power'
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 1.5)
);

renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();

scene.fog = new THREE.FogExp2(0x000000, 0.011);
scene.fog.color.setRGB(0.145, 0.157, 0.160); // = couleur de l'horizon du ciel
renderer.setClearColor(scene.fog.color);

const camera = new THREE.PerspectiveCamera(
  65,
  1,
  0.1,
  5000
);

camera.position.set(0, 1.7, 13);
camera.rotation.order = 'YXZ';

// ==========================================
// 2. SHARED SKY - DARK SNOWY OVERCAST (FROZEN, NO DAY/NIGHT)
// ==========================================

const skyUniforms = {
  uTime: { value: 0 }
};

const skyMaterial = new THREE.ShaderMaterial({

  uniforms: skyUniforms,
  side: THREE.BackSide,
  depthWrite: false,

  vertexShader: `
    varying vec3 vDirection;

    void main() {
      vDirection = position;

      gl_Position = projectionMatrix *
                    modelViewMatrix *
                    vec4(position, 1.0);
    }
  `,

  fragmentShader: `

    varying vec3 vDirection;
    uniform float uTime;

    float hash(vec3 p) {
      p = fract(p * 0.3183099 + vec3(0.1));
      p *= 17.0;
      return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
    }

    float noise(vec3 p) {
      vec3 i = floor(p);
      vec3 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = mix(hash(i), hash(i + vec3(1.0,0.0,0.0)), f.x);
      float b = mix(hash(i + vec3(0.0,1.0,0.0)), hash(i + vec3(1.0,1.0,0.0)), f.x);
      float c = mix(hash(i + vec3(0.0,0.0,1.0)), hash(i + vec3(1.0,0.0,1.0)), f.x);
      float d = mix(hash(i + vec3(0.0,1.0,1.0)), hash(i + vec3(1.0,1.0,1.0)), f.x);
      return mix(mix(a, b, f.y), mix(c, d, f.y), f.z);
    }

    float fbm(vec3 p) {
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < 5; i++) {
        v += noise(p) * a;
        p *= 2.03;
        a *= 0.5;
      }
      return v;
    }

    void main() {

      vec3 dir = normalize(vDirection);
      float h = max(dir.y, 0.0);

      // Doit rester identique a la couleur du brouillard (scene.fog.color)
      vec3 horizon = vec3(0.145, 0.157, 0.160);
      vec3 zenith  = vec3(0.030, 0.036, 0.042);

      vec3 col = mix(horizon, zenith, pow(smoothstep(0.0, 0.85, h), 0.7));

      // Nuages lourds qui derivent lentement. Pas de cycle jour/nuit.
      vec3 q = vec3(dir.x, dir.y * 2.6, dir.z) * 2.2;
      q.x += uTime * 0.045;
      q.z += uTime * 0.018;

      float big  = fbm(q);
      float fine = fbm(dir * 7.5 + vec3(uTime * 0.09, 0.0, uTime * 0.035));
      float c = big * 0.72 + fine * 0.28;

      float density = smoothstep(0.28, 0.66, c);

      vec3 under = vec3(0.040, 0.046, 0.052);
      vec3 top   = vec3(0.235, 0.238, 0.236);
      vec3 cloud = mix(under, top, smoothstep(0.30, 0.80, fine) * 0.9);

      // Lueur de la ville reflechie par les nuages de neige
      float glow = exp(-pow(h * 3.4, 2.0));
      cloud += vec3(0.20, 0.12, 0.06) * glow * 0.35;

      col = mix(col, cloud, density * 0.92);
      col += vec3(0.050, 0.036, 0.022) * glow * 0.7;

      // Raccord parfait avec le brouillard a l'horizon
      col = mix(horizon, col, smoothstep(0.0, 0.12, h));

      // Leger grain contre les bandes dans les degrades sombres
      col += (hash(dir * 1000.0) - 0.5) * 0.012;

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

// ==========================================
// SKY SPHERE
// ==========================================

const skySphere = new THREE.Mesh(
  new THREE.SphereGeometry(1800, 64, 48),
  skyMaterial
);

skySphere.frustumCulled = false;
skySphere.renderOrder = -100;

scene.add(skySphere);
// ==========================================
// 3. GLOBAL LIGHTING
// ==========================================

// Soft late-afternoon daylight.

scene.add(
  new THREE.AmbientLight(
    0x8d9aa6,
    0.055
  )
);

// Sky light: cold and diffuse.

const hemisphere = new THREE.HemisphereLight(
  0x7f909d,
  0x23201e,
  0.085
);

scene.add(hemisphere);

// Weak sunlight filtered by thick clouds.

const daylight = new THREE.DirectionalLight(
  0x8fa0ad,
  0.035
);

daylight.position.set(
  -80,
  35,
  -100
);

scene.add(daylight);

// ==========================================
// 3b. SHARED SNOW (same in every world, visible through windows)
// ==========================================

const snow = (() => {

  const VERT = `
    uniform float uTime, uSize, uScale, uFall, uMax, uFogD;
    uniform vec3 uCam, uBox;
    uniform vec2 uWind;
    uniform vec3 uExMin[4];
    uniform vec3 uExMax[4];
    attribute vec4 aRand;
    varying float vAlpha;

    void main() {
      vec3 p = position * uBox;

      float fall = uFall * (0.75 + 0.5 * aRand.z);
      p.y -= uTime * fall;

      float amp = 0.3 + 0.8 * aRand.w;
      float sw1 = sin(uTime * (0.8 + aRand.x) + aRand.y * 40.0);
      float sw2 = cos(uTime * (0.7 + aRand.y) + aRand.x * 40.0);

      p.x += uWind.x * (0.7 + 0.6 * aRand.y) + sw1 * amp;
      p.z += uWind.y * (0.7 + 0.6 * aRand.x) + sw2 * amp;

      vec3 rel = mod(p - vec3(uCam.x, 0.0, uCam.z), uBox);
      vec3 world = vec3(uCam.x - uBox.x * 0.5 + rel.x, rel.y, uCam.z - uBox.z * 0.5 + rel.z);

      vec4 mv = modelViewMatrix * vec4(world, 1.0);
      gl_Position = projectionMatrix * mv;

      float dist = max(-mv.z, 0.01);
      float raw = uSize * (0.55 + 0.9 * aRand.w) * uScale / dist;
      gl_PointSize = clamp(raw, 1.6, uMax);

      float edge = max(abs(world.x - uCam.x) / (uBox.x * 0.5), abs(world.z - uCam.z) / (uBox.z * 0.5));
      float a = 1.0 - smoothstep(0.75, 1.0, edge);
      a *= smoothstep(0.0, 0.5, world.y);
      a *= 1.0 - smoothstep(uBox.y - 4.0, uBox.y, world.y);
      a *= smoothstep(0.25, 1.2, dist);
      a *= exp(-pow(uFogD * dist, 2.0));
      a *= min(1.0, raw / 1.6 + 0.2);

      // Zones sans neige (interieur d'une piece)
      for (int i = 0; i < 4; i++) {
        if (world.x > uExMin[i].x && world.x < uExMax[i].x &&
            world.y > uExMin[i].y && world.y < uExMax[i].y &&
            world.z > uExMin[i].z && world.z < uExMax[i].z) {
          a = 0.0;
        }
      }

      vAlpha = a;
    }
  `;

  const FRAG = `
    uniform vec3 uColor;
    uniform float uSoft, uOpacity;
    varying float vAlpha;

    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      float a = (1.0 - smoothstep(uSoft, 1.0, d)) * vAlpha * uOpacity;
      if (a < 0.01) discard;
      gl_FragColor = vec4(uColor, a);
    }
  `;

  const group = new THREE.Group();
  group.visible = false; // OFF par defaut : chaque lieu exterieur l'active
  scene.add(group);

  const exMin = [];
  const exMax = [];
  for (let i = 0; i < 4; i++) {
    exMin.push(new THREE.Vector3(1e5, 1e5, 1e5));
    exMax.push(new THREE.Vector3(-1e5, -1e5, -1e5));
  }

  const fogD = scene.fog ? scene.fog.density : 0.011;
  const mats = [];

  function layer(count, size, fall, box, soft, opacity, maxSize) {

    const pos = new Float32Array(count * 3);
    const rr = new Float32Array(count * 4);

    for (let i = 0; i < pos.length; i++) pos[i] = Math.random();
    for (let i = 0; i < rr.length; i++) rr[i] = Math.random();

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('aRand', new THREE.BufferAttribute(rr, 4));

    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uSize: { value: size },
        uScale: { value: 600 },
        uFall: { value: fall },
        uMax: { value: maxSize },
        uFogD: { value: fogD },
        uCam: { value: new THREE.Vector3() },
        uBox: { value: box },
        uWind: { value: new THREE.Vector2() },
        uExMin: { value: exMin },
        uExMax: { value: exMax },
        uColor: { value: new THREE.Vector3(0.80, 0.84, 0.88) },
        uSoft: { value: soft },
        uOpacity: { value: opacity }
      },
      vertexShader: VERT,
      fragmentShader: FRAG,
      transparent: true,
      depthWrite: false
    });

    const pts = new THREE.Points(geo, mat);
    pts.frustumCulled = false;
    group.add(pts);
    mats.push(mat);
  }

  // fins, moyens, gros flous proches
  layer(2400, 0.022, 1.6, new THREE.Vector3(70, 28, 70), 0.35, 0.85, 8);
  layer(700,  0.055, 1.3, new THREE.Vector3(46, 26, 46), 0.25, 0.90, 16);
  layer(110,  0.140, 1.0, new THREE.Vector3(24, 20, 24), 0.0,  0.55, 56);

  let wx = 0;
  let wz = 0;
  let nEx = 0;
  const buf = new THREE.Vector2();

  return {

    // Pas de neige a l'interieur de cette boite (ex. une chambre)
    excludeBox(minX, minY, minZ, maxX, maxY, maxZ) {
      if (nEx >= 4) return;
      exMin[nEx].set(minX, minY, minZ);
      exMax[nEx].set(maxX, maxY, maxZ);
      nEx++;
    },

    setEnabled(v) {
      group.visible = !!v;
    },

    update(dt, time) {

      if (!group.visible) return;

      wx += (1.1 + 0.6 * Math.sin(time * 0.13) + 0.3 * Math.sin(time * 0.41)) * dt;
      wz += (0.2 + 0.15 * Math.sin(time * 0.09)) * dt;

      renderer.getDrawingBufferSize(buf);
      const scale = buf.y / (2 * Math.tan(camera.fov * Math.PI / 360));

      for (const m of mats) {
        const u = m.uniforms;
        u.uTime.value = time;
        u.uScale.value = scale;
        u.uWind.value.set(wx, wz);
        u.uCam.value.copy(camera.position);
      }
    }
  };

})();

// ==========================================
// 4. WORLD LOADING
// ==========================================

const params = new URLSearchParams(
  window.location.search
);

const worldFile = params.get('world') || 'bedroom.js';

let world;

try {

  const worldModule = await import(
    new URL(worldFile, window.location.href).href
  );

  if (typeof worldModule.buildWorld !== 'function') {
    throw new Error(
      'Le fichier du décor doit exporter buildWorld(scene).'
    );
  }

 world = worldModule.buildWorld(scene, {
  camera,
  renderer,
  snow
});

} catch (error) {

  console.error('Erreur de chargement du décor :', error);

  const panel = document.getElementById('errorPanel');

  panel.style.display = 'flex';

  panel.textContent =
    'Impossible de charger le décor : ' +
    worldFile +
    '\n\n' +
    error.message;
}

// ==========================================
// 5. JOYSTICKS
// ==========================================

let jLx = 0;
let jLy = 0;
let jRx = 0;
let jRy = 0;

function setupJoy(id, callback) {

  const cv = document.getElementById(id);

  let active = false;
  let bx = 0;
  let by = 0;

  function position(e) {

    const r = cv.getBoundingClientRect();

    return {
      x: (e.clientX - r.left) * cv.width / r.width,
      y: (e.clientY - r.top) * cv.height / r.height
    };
  }

  function start(e) {

    e.preventDefault();

    const p = position(e);

    bx = p.x;
    by = p.y;

    active = true;

    cv.setPointerCapture(e.pointerId);
  }

  function move(e) {

    if (!active) return;

    e.preventDefault();

    const p = position(e);

    let x = (p.x - bx) / 45;
    let y = (p.y - by) / 22;

    const length = Math.hypot(x, y);

    if (length > 1) {
      x /= length;
      y /= length;
    }

    callback(x, y);
  }

  function end() {
    active = false;
    callback(0, 0);
  }

  cv.addEventListener('pointerdown', start);
  cv.addEventListener('pointermove', move);
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('lostpointercapture', end);
}

setupJoy('jL', (x, y) => {
  jLx = x;
  jLy = y;
});

setupJoy('jR', (x, y) => {
  jRx = x;
  jRy = y;
});

// ==========================================
// 6. JOYSTICK DESIGN
// ==========================================

function drawJoy(id, dx, dy) {

  const cv = document.getElementById(id);
  const ctx = cv.getContext('2d');

  ctx.clearRect(0, 0, 120, 60);

  ctx.fillStyle = '#25232b';

  ctx.beginPath();
  ctx.ellipse(60, 30, 55, 25, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#665b59';
  ctx.lineWidth = 1.3;
  ctx.stroke();

  const x = 60 + dx * 38;
  const y = 30 + dy * 16;

  const gradient = ctx.createRadialGradient(
    x - 3, y - 3, 1,
    x, y, 15
  );

  gradient.addColorStop(0, '#c6bdb2');
  gradient.addColorStop(1, '#655d57');

  ctx.fillStyle = gradient;

  ctx.beginPath();
  ctx.ellipse(x, y, 14, 10, 0, 0, Math.PI * 2);
  ctx.fill();
}

// ==========================================
// 7. CAMERA
// ==========================================

let camYaw = 0;
let camPitch = 0;

let dragging = false;
let lastX = 0;
let lastY = 0;

canvas.addEventListener('pointerdown', e => {

  if (e.pointerType === 'mouse') {

    dragging = true;

    lastX = e.clientX;
    lastY = e.clientY;

    canvas.setPointerCapture(e.pointerId);
  }
});

canvas.addEventListener('pointermove', e => {

  if (!dragging) return;

  camYaw -= (e.clientX - lastX) * 0.004;
  camPitch -= (e.clientY - lastY) * 0.003;

  camPitch = THREE.MathUtils.clamp(
    camPitch, -1, 1
  );

  lastX = e.clientX;
  lastY = e.clientY;
});

canvas.addEventListener('pointerup', () => {
  dragging = false;
});

canvas.addEventListener('pointercancel', () => {
  dragging = false;
});

// ==========================================
// 7b. SAVED POSITION (cache navigateur + export JSON)
// ==========================================

const SAVE_KEY = 'bt_player_state';
const SPAWN = {
  x: camera.position.x,
  y: camera.position.y,
  z: camera.position.z,
  yaw: 0,
  pitch: 0
};

function readState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    const obj = raw ? JSON.parse(raw) : null;
    if (obj && obj.worlds && typeof obj.worlds === 'object') return obj;
  } catch (error) {
    console.warn('Sauvegarde illisible :', error);
  }
  return { version: 1, last: null, worlds: {} };
}

function writeState(state) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  } catch (error) {
    console.warn('Sauvegarde impossible :', error);
  }
}

function currentPose() {
  return {
    x: +camera.position.x.toFixed(3),
    y: +camera.position.y.toFixed(3),
    z: +camera.position.z.toFixed(3),
    yaw: +camYaw.toFixed(4),
    pitch: +camPitch.toFixed(4)
  };
}

function applyPose(p) {
  if (!p || !Number.isFinite(p.x) || !Number.isFinite(p.z)) return false;

  camera.position.set(p.x, Number.isFinite(p.y) ? p.y : 1.7, p.z);
  camYaw = Number.isFinite(p.yaw) ? p.yaw : 0;
  camPitch = THREE.MathUtils.clamp(Number.isFinite(p.pitch) ? p.pitch : 0, -1, 1);

  camera.rotation.y = camYaw;
  camera.rotation.x = camPitch;
  return true;
}

function saveNow() {
  const state = readState();
  state.version = 1;
  state.last = worldFile;
  state.worlds[worldFile] = Object.assign(currentPose(), { t: Date.now() });
  writeState(state);
}

// Restauration au chargement (?spawn=start pour forcer le point de depart)

if (params.get('spawn') !== 'start') {
  applyPose(readState().worlds[worldFile]);
}

// Sauvegarde automatique : toutes les secondes si on a bouge, et en quittant la page

let saveClock = 0;
let lastSaved = '';

function savePosition(dt) {
  saveClock += dt;
  if (saveClock < 1) return;
  saveClock = 0;

  const key = JSON.stringify(currentPose());
  if (key === lastSaved) return;

  lastSaved = key;
  saveNow();
}

window.addEventListener('pagehide', saveNow);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) saveNow();
});

// API pour ton export / import JSON existant

window.BadTherapist = window.BadTherapist || {};

Object.assign(window.BadTherapist, {

  // A mettre dans ton JSON d'export : player: BadTherapist.getPlayerState()
  getPlayerState() {
    saveNow();
    return readState();
  },

  // A appeler quand tu importes un JSON : BadTherapist.setPlayerState(data.player)
  setPlayerState(state) {
    if (!state || !state.worlds) return;
    writeState(state);
    applyPose(state.worlds[worldFile]);
  },

  resetPosition() {
    const state = readState();
    delete state.worlds[worldFile];
    writeState(state);
    applyPose(SPAWN);
    lastSaved = '';
  }
});

document.getElementById('resetPosBtn')
.addEventListener('click', () => {

  window.BadTherapist.resetPosition();

  const button = document.getElementById('resetPosBtn');
  button.textContent = 'DONE';

  setTimeout(() => {
    button.textContent = 'RESET POSITION';
  }, 1200);
});

// ==========================================
// 8. HUD INTERACTIONS
// ==========================================

// HOME

document.getElementById('homeButton')
.addEventListener('click', () => {

  saveNow();

  sessionStorage.setItem('bt_intro_position', '0');

  window.location.href = 'index.html';
});

// PANELS

const panels = [
  'coordPanel',
  'itemPanel',
  'mapPanel'
];

function togglePanel(panelId) {

  const selectedPanel = document.getElementById(panelId);

  const isAlreadyOpen =
    selectedPanel.style.display === 'block';

  panels.forEach(id => {
    document.getElementById(id).style.display = 'none';
  });

  selectedPanel.style.display =
    isAlreadyOpen ? 'none' : 'block';
}

document.getElementById('positionButton')
.addEventListener('click', () => {
  togglePanel('coordPanel');
});

document.getElementById('itemButton')
.addEventListener('click', () => {
  togglePanel('itemPanel');
});

document.getElementById('mapButton')
.addEventListener('click', () => {
  togglePanel('mapPanel');
});

// CLOSE PANELS

document.querySelectorAll('.panel-close').forEach(button => {

  button.addEventListener('click', () => {

    document.getElementById(
      button.dataset.close
    ).style.display = 'none';

  });

});

// COPY COORDINATES

document.getElementById('copyBtn')
.addEventListener('click', async () => {

  const p = camera.position;

  const text =
    `X:${p.x.toFixed(2)} Y:${p.y.toFixed(2)} Z:${p.z.toFixed(2)}`;

  try {

    await navigator.clipboard.writeText(text);

    document.getElementById('copyBtn').textContent = 'COPIED';

    setTimeout(() => {
      document.getElementById('copyBtn').textContent = 'COPY';
    }, 1200);

  } catch(error) {

    console.error('Clipboard unavailable:', error);

  }
});

// ==========================================
// 9. RESIZE
// ==========================================

function resize() {

  const w = window.innerWidth;
  const h = Math.max(1, window.innerHeight - 70);

  renderer.setSize(w, h);

  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

window.addEventListener('resize', resize);
resize();

// ==========================================
// 10. ANIMATION
// ==========================================

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);

  // SKY FOLLOWS CAMERA

  skySphere.position.copy(camera.position);

  skyUniforms.uTime.value = clock.elapsedTime;

  // CAMERA ROTATION

  camera.rotation.y = camYaw;
  camera.rotation.x = camPitch;

  // FORWARD / BACKWARD

  const forward = new THREE.Vector3(
    -Math.sin(camYaw),
    0,
    -Math.cos(camYaw)
  );

  // LEFT / RIGHT

  const right = new THREE.Vector3(
    Math.cos(camYaw),
    0,
    -Math.sin(camYaw)
  );

  camera.position.addScaledVector(
    forward, -jLy * 6.5 * dt
  );

  camera.position.addScaledVector(
    right, jLx * 6.5 * dt
  );

  // CONSTANT HEIGHT

  camera.position.y = 1.7;

  // RIGHT JOYSTICK CAMERA ROTATION

  camYaw -= jRx * 1.8 * dt;

  camPitch = THREE.MathUtils.clamp(
    camPitch - jRy * 1.2 * dt,
    -1,
    1
  );

  // COORDINATES

  if (
    document.getElementById('coordPanel').style.display === 'block'
  ) {

    document.getElementById('cx').textContent =
      camera.position.x.toFixed(2);

    document.getElementById('cy').textContent =
      camera.position.y.toFixed(2);

    document.getElementById('cz').textContent =
      camera.position.z.toFixed(2);
  }

  // SAVE POSITION

  savePosition(dt);

  // SHARED SNOW

  snow.update(dt, clock.elapsedTime);

  // WORLD UPDATE

  if (world && typeof world.update === 'function') {
    world.update(dt, clock.elapsedTime);
  }

  renderer.render(scene, camera);

  // JOYSTICKS

  drawJoy('jL', jLx, jLy);
  drawJoy('jR', jRx, jRy);
}

animate();

</script>
