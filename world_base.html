
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script src="save-data.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" type="image/png" href="./images/logo.png">
<title>Bad Therapist</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #252829;
  font-family: Arial, sans-serif;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#gc {
  display: block;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: calc(100% - 70px);
  touch-action: none;
}

/* HUD */

#homeButton {
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 30;
}

#topHud {
  position: fixed;
  top: 14px;
  right: 14px;
  display: flex;
  align-items: center;
  gap: 9px;
  z-index: 30;
}

.hud-icon {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(23, 23, 32, 0.9);
  border: 1px solid #625047;
  border-radius: 10px;
  color: #d9c5b5;
  cursor: pointer;
  transition: 0.2s;
}

.hud-icon:hover,
.hud-icon:active {
  background: #39313b;
  color: white;
}

.hud-icon svg {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#moneyDisplay {
  padding: 11px 13px;
  background: rgba(23, 23, 32, 0.9);
  border: 1px solid #7c3535;
  border-radius: 10px;
  color: #ff5555;
  font: bold 15px monospace;
  white-space: nowrap;
}

/* PANELS */

.hud-panel {
  display: none;
  position: fixed;
  top: 68px;
  right: 14px;
  width: min(280px, calc(100vw - 28px));
  padding: 16px;
  background: rgba(23, 23, 32, 0.97);
  border: 1px solid #625047;
  border-radius: 10px;
  color: #ddd0c3;
  z-index: 40;
  font: 12px/1.8 monospace;
}

.panel-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  color: #d9c5b5;
  letter-spacing: 1px;
}

.panel-close {
  background: none;
  border: none;
  color: #aaa;
  font-size: 20px;
  cursor: pointer;
}

#copyBtn,
#resetPosBtn {
  display: block;
  width: 100%;
  padding: 6px;
  margin-top: 7px;
  background: #302733;
  color: white;
  border: 1px solid #625047;
  border-radius: 4px;
  cursor: pointer;
  font: 10px monospace;
}

#inventoryGrid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.inventory-slot {
  aspect-ratio: 1;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid #51464b;
  border-radius: 5px;
}

#mapCanvas {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  background: #0d1013;
  border: 1px solid #3a3338;
  border-radius: 6px;
  touch-action: none;
  cursor: grab;
}

.map-btns {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.map-btns button {
  flex: 1;
  padding: 7px 4px;
  background: #302733;
  color: #ddd0c3;
  border: 1px solid #625047;
  border-radius: 5px;
  cursor: pointer;
  font: 11px monospace;
}

.map-btns button:active {
  background: #4a3d4d;
}

.panel-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Carte agrandie : presque tout l'écran */
#mapPanel.expanded[style*="block"] {
  display: flex !important;
  flex-direction: column;
  top: 8px;
  left: 8px;
  right: 8px;
  bottom: 78px;
  width: auto;
}

#mapPanel.expanded #mapCanvas {
  flex: 1;
  min-height: 0;
  aspect-ratio: auto;
}

/* Bouton d'action (monter / descendre du camion) */
#actionBtn {
  display: none;
  position: fixed;
  left: 50%;
  bottom: 88px;
  transform: translateX(-50%);
  z-index: 35;
  padding: 13px 30px;
  background: rgba(23, 23, 32, 0.93);
  border: 1px solid #c9a46a;
  border-radius: 12px;
  color: #f0e0c8;
  font: bold 14px monospace;
  letter-spacing: 3px;
  cursor: pointer;
}

#actionBtn:active {
  background: #4a3d33;
}

/* JOYSTICKS */

#hud {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 70px;
  background: rgba(23, 23, 32, 0.96);
  border-top: 1px solid #393541;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 20;
}

#jL, #jR {
  width: 120px;
  height: 60px;
  touch-action: none;
}

/* ERROR */

#errorPanel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #111722;
  color: #eee;
  padding: 25px;
  align-items: center;
  justify-content: center;
  text-align: center;
  font: 14px/1.7 monospace;
  white-space: pre-wrap;
}

/* MOBILE */

@media (max-width: 480px) {
  #homeButton {
    top: 10px;
    left: 8px;
  }

  #topHud {
    top: 10px;
    right: 8px;
    gap: 5px;
  }

  .hud-icon {
    width: 36px;
    height: 36px;
  }

  .hud-icon svg {
    width: 18px;
    height: 18px;
  }

  #moneyDisplay {
    padding: 9px 8px;
    font-size: 12px;
  }

  .hud-panel {
    top: 58px;
    right: 8px;
  }
}

<script type="module">

import * as THREE from 'three';

// ==========================================
// 1. SCENE
// ==========================================

const canvas = document.getElementById('gc');

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'low-power'
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 1.5)
);

renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();

const FOG_DENSITY = 0.0075;   // réglable : plus petit = on voit plus loin (montagnes)
scene.fog = new THREE.FogExp2(0x000000, FOG_DENSITY);
scene.fog.color.setRGB(0.145, 0.157, 0.160); // = couleur de l'horizon du ciel
renderer.setClearColor(scene.fog.color);

const camera = new THREE.PerspectiveCamera(
  65,
  1,
  0.15,
  5000
);

camera.position.set(0, 1.7, 13);
camera.rotation.order = 'YXZ';

// ==========================================
// 2. SHARED SKY - DARK SNOWY OVERCAST (FROZEN, NO DAY/NIGHT)
// ==========================================

const skyUniforms = {
  uTime: { value: 0 }
};

const skyMaterial = new THREE.ShaderMaterial({

  uniforms: skyUniforms,
  side: THREE.BackSide,
  depthWrite: false,

  vertexShader: `
    varying vec3 vDirection;

    void main() {
      vDirection = position;

      gl_Position = projectionMatrix *
                    modelViewMatrix *
                    vec4(position, 1.0);
    }
  `,

  fragmentShader: `

    varying vec3 vDirection;
    uniform float uTime;

    float hash(vec3 p) {
      p = fract(p * 0.3183099 + vec3(0.1));
      p *= 17.0;
      return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
    }

    float noise(vec3 p) {
      vec3 i = floor(p);
      vec3 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = mix(hash(i), hash(i + vec3(1.0,0.0,0.0)), f.x);
      float b = mix(hash(i + vec3(0.0,1.0,0.0)), hash(i + vec3(1.0,1.0,0.0)), f.x);
      float c = mix(hash(i + vec3(0.0,0.0,1.0)), hash(i + vec3(1.0,0.0,1.0)), f.x);
      float d = mix(hash(i + vec3(0.0,1.0,1.0)), hash(i + vec3(1.0,1.0,1.0)), f.x);
      return mix(mix(a, b, f.y), mix(c, d, f.y), f.z);
    }

    float fbm(vec3 p) {
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < 5; i++) {
        v += noise(p) * a;
        p *= 2.03;
        a *= 0.5;
      }
      return v;
    }

    void main() {

      vec3 dir = normalize(vDirection);
      float h = max(dir.y, 0.0);

      // Doit rester identique a la couleur du brouillard (scene.fog.color)
      vec3 horizon = vec3(0.145, 0.157, 0.160);
      vec3 zenith  = vec3(0.030, 0.036, 0.042);

      vec3 col = mix(horizon, zenith, pow(smoothstep(0.0, 0.85, h), 0.7));

      // Nuages lourds qui derivent lentement. Pas de cycle jour/nuit.
      vec3 q = vec3(dir.x, dir.y * 2.6, dir.z) * 2.2;
      q.x += uTime * 0.045;
      q.z += uTime * 0.018;

      float big  = fbm(q);
      float fine = fbm(dir * 7.5 + vec3(uTime * 0.09, 0.0, uTime * 0.035));
      float c = big * 0.72 + fine * 0.28;

      float density = smoothstep(0.28, 0.66, c);

      vec3 under = vec3(0.040, 0.046, 0.052);
      vec3 top   = vec3(0.235, 0.238, 0.236);
      vec3 cloud = mix(under, top, smoothstep(0.30, 0.80, fine) * 0.9);

      // Lueur de la ville reflechie par les nuages de neige
      float glow = exp(-pow(h * 3.4, 2.0));
      cloud += vec3(0.20, 0.12, 0.06) * glow * 0.35;

      col = mix(col, cloud, density * 0.92);
      col += vec3(0.050, 0.036, 0.022) * glow * 0.7;

      // Raccord parfait avec le brouillard a l'horizon
      col = mix(horizon, col, smoothstep(0.0, 0.12, h));

      // Leger grain contre les bandes dans les degrades sombres
      col += (hash(dir * 1000.0) - 0.5) * 0.012;

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

// ==========================================
// SKY SPHERE
// ==========================================

const skySphere = new THREE.Mesh(
  new THREE.SphereGeometry(1800, 64, 48),
  skyMaterial
);

skySphere.frustumCulled = false;
skySphere.renderOrder = -100;

scene.add(skySphere);
// ==========================================
// 3. GLOBAL LIGHTING
// ==========================================

// Soft late-afternoon daylight.

scene.add(
  new THREE.AmbientLight(
    0x8d9aa6,
    0.055
  )
);

// Sky light: cold and diffuse.

const hemisphere = new THREE.HemisphereLight(
  0x7f909d,
  0x23201e,
  0.085
);

scene.add(hemisphere);

// Weak sunlight filtered by thick clouds.

const daylight = new THREE.DirectionalLight(
  0x8fa0ad,
  0.035
);

daylight.position.set(
  -80,
  35,
  -100
);

scene.add(daylight);

// ==========================================
// 3b. SHARED SNOW (same in every world, visible through windows)
// ==========================================

const snow = (() => {

  const VERT = `
    uniform float uTime, uSize, uScale, uFall, uMax, uFogD, uBaseY;
    uniform vec3 uCam, uBox;
    uniform vec2 uWind;
    uniform vec3 uExMin[6];
    uniform vec3 uExMax[6];
    attribute vec4 aRand;
    varying float vAlpha;

    void main() {
      vec3 p = position * uBox;

      float fall = uFall * (0.75 + 0.5 * aRand.z);
      p.y -= uTime * fall;

      float amp = 0.3 + 0.8 * aRand.w;
      float sw1 = sin(uTime * (0.8 + aRand.x) + aRand.y * 40.0);
      float sw2 = cos(uTime * (0.7 + aRand.y) + aRand.x * 40.0);

      p.x += uWind.x * (0.7 + 0.6 * aRand.y) + sw1 * amp;
      p.z += uWind.y * (0.7 + 0.6 * aRand.x) + sw2 * amp;

      vec3 rel = mod(p - vec3(uCam.x, 0.0, uCam.z), uBox);
      vec3 world = vec3(uCam.x - uBox.x * 0.5 + rel.x, uBaseY + rel.y, uCam.z - uBox.z * 0.5 + rel.z);

      vec4 mv = modelViewMatrix * vec4(world, 1.0);
      gl_Position = projectionMatrix * mv;

      float dist = max(-mv.z, 0.01);
      float raw = uSize * (0.55 + 0.9 * aRand.w) * uScale / dist;
      gl_PointSize = clamp(raw, 1.6, uMax);

      float edge = max(abs(world.x - uCam.x) / (uBox.x * 0.5), abs(world.z - uCam.z) / (uBox.z * 0.5));
      float a = 1.0 - smoothstep(0.75, 1.0, edge);
      a *= smoothstep(0.0, 0.5, rel.y);
      a *= 1.0 - smoothstep(uBox.y - 4.0, uBox.y, rel.y);
      a *= smoothstep(0.25, 1.2, dist);
      a *= exp(-pow(uFogD * dist, 2.0));
      a *= min(1.0, raw / 1.6 + 0.2);

      // Zones sans neige (interieur d'une piece)
      for (int i = 0; i < 6; i++) {
        if (world.x > uExMin[i].x && world.x < uExMax[i].x &&
            world.y > uExMin[i].y && world.y < uExMax[i].y &&
            world.z > uExMin[i].z && world.z < uExMax[i].z) {
          a = 0.0;
        }
      }

      vAlpha = a;
    }
  `;

  const FRAG = `
    uniform vec3 uColor;
    uniform float uSoft, uOpacity;
    varying float vAlpha;

    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      float a = (1.0 - smoothstep(uSoft, 1.0, d)) * vAlpha * uOpacity;
      if (a < 0.01) discard;
      gl_FragColor = vec4(uColor, a);
    }
  `;

  const group = new THREE.Group();
  group.visible = false; // OFF par defaut : chaque lieu exterieur l'active
  scene.add(group);

  const exMin = [];
  const exMax = [];
  for (let i = 0; i < 6; i++) {
    exMin.push(new THREE.Vector3(1e5, 1e5, 1e5));
    exMax.push(new THREE.Vector3(-1e5, -1e5, -1e5));
  }

  const fogD = scene.fog ? scene.fog.density : 0.011;
  const mats = [];

  function layer(count, size, fall, box, soft, opacity, maxSize) {

    const pos = new Float32Array(count * 3);
    const rr = new Float32Array(count * 4);

    for (let i = 0; i < pos.length; i++) pos[i] = Math.random();
    for (let i = 0; i < rr.length; i++) rr[i] = Math.random();

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('aRand', new THREE.BufferAttribute(rr, 4));

    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uSize: { value: size },
        uScale: { value: 600 },
        uFall: { value: fall },
        uMax: { value: maxSize },
        uFogD: { value: fogD },
        uBaseY: { value: 0 },
        uCam: { value: new THREE.Vector3() },
        uBox: { value: box },
        uWind: { value: new THREE.Vector2() },
        uExMin: { value: exMin },
        uExMax: { value: exMax },
        uColor: { value: new THREE.Vector3(0.80, 0.84, 0.88) },
        uSoft: { value: soft },
        uOpacity: { value: opacity }
      },
      vertexShader: VERT,
      fragmentShader: FRAG,
      transparent: true,
      depthWrite: false
    });

    const pts = new THREE.Points(geo, mat);
    pts.frustumCulled = false;
    group.add(pts);
    mats.push(mat);
  }

  // fins, moyens, gros flous proches
  layer(2400, 0.022, 1.6, new THREE.Vector3(70, 28, 70), 0.35, 0.85, 8);
  layer(700,  0.055, 1.3, new THREE.Vector3(46, 26, 46), 0.25, 0.90, 16);
  layer(110,  0.140, 1.0, new THREE.Vector3(24, 20, 24), 0.0,  0.55, 56);

  let wx = 0;
  let wz = 0;
  let nEx = 0;
  let baseY = 0;
  const buf = new THREE.Vector2();

  return {

    // Pas de neige a l'interieur de cette boite (ex. une chambre)
    excludeBox(minX, minY, minZ, maxX, maxY, maxZ) {
      if (nEx >= 6) return;
      exMin[nEx].set(minX, minY, minZ);
      exMax[nEx].set(maxX, maxY, maxZ);
      nEx++;
    },

    setEnabled(v) {
      group.visible = !!v;
    },

    // Altitude du sol sous le joueur : la neige tombe toujours au-dessus du sol
    // (rue au niveau -18.9, collines, montagnes...)
    setBaseY(v) {
      baseY = v;
    },

    // Dessine la neige autour d'une autre caméra (fenêtre, porte vitrée...).
    // target = scène dans laquelle on la dessine (null = la scène principale).
    withView(target, pos, base, fn) {

      if (!group.visible) { fn(); return; }

      const saved = mats.map(m => ({
        cam: m.uniforms.uCam.value.clone(),
        base: m.uniforms.uBaseY.value
      }));
      const savedMin = exMin.map(v => v.clone());
      const savedMax = exMax.map(v => v.clone());

      for (const m of mats) {
        m.uniforms.uCam.value.copy(pos);
        m.uniforms.uBaseY.value = base;
      }
      exMin.forEach(v => v.set(1e5, 1e5, 1e5));
      exMax.forEach(v => v.set(-1e5, -1e5, -1e5));

      if (target) target.add(group);

      try {
        fn();
      } finally {
        if (target) scene.add(group);
        mats.forEach((m, i) => {
          m.uniforms.uCam.value.copy(saved[i].cam);
          m.uniforms.uBaseY.value = saved[i].base;
        });
        exMin.forEach((v, i) => v.copy(savedMin[i]));
        exMax.forEach((v, i) => v.copy(savedMax[i]));
      }
    },

    update(dt, time) {

      if (!group.visible) return;

      wx += (1.1 + 0.6 * Math.sin(time * 0.13) + 0.3 * Math.sin(time * 0.41)) * dt;
      wz += (0.2 + 0.15 * Math.sin(time * 0.09)) * dt;

      renderer.getDrawingBufferSize(buf);
      const scale = buf.y / (2 * Math.tan(camera.fov * Math.PI / 360));

      for (const m of mats) {
        const u = m.uniforms;
        u.uTime.value = time;
        u.uScale.value = scale;
        u.uBaseY.value = baseY;
        u.uFogD.value = scene.fog ? scene.fog.density : fogD;

let jLx = 0;
let jLy = 0;
let jRx = 0;
let jRy = 0;

function setupJoy(id, callback) {

  const cv = document.getElementById(id);

  let active = false;
  let bx = 0;
  let by = 0;

  function position(e) {

    const r = cv.getBoundingClientRect();

    return {
      x: (e.clientX - r.left) * cv.width / r.width,
      y: (e.clientY - r.top) * cv.height / r.height
    };
  }

  function start(e) {

    e.preventDefault();

    const p = position(e);

    bx = p.x;
    by = p.y;

    active = true;

    cv.setPointerCapture(e.pointerId);
  }

  function move(e) {

    if (!active) return;

    e.preventDefault();

    const p = position(e);

    let x = (p.x - bx) / 45;
    let y = (p.y - by) / 22;

    const length = Math.hypot(x, y);

    if (length > 1) {
      x /= length;
      y /= length;
    }

    callback(x, y);
  }

  function end() {
    active = false;
    callback(0, 0);
  }

  cv.addEventListener('pointerdown', start);
  cv.addEventListener('pointermove', move);
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('lostpointercapture', end);
}

setupJoy('jL', (x, y) => {
  jLx = x;
  jLy = y;
});

setupJoy('jR', (x, y) => {
  jRx = x;
  jRy = y;
});

  ctx.strokeStyle = '#665b59';
  ctx.lineWidth = 1.3;

}

let dragging = false;

canvas.addEventListener('pointerdown', e => {

});

const SAVE_KEY = 'bt_player_state';
const SPAWN = {
  x: camera.position.x,
  y: camera.position.y,
  z: camera.position.z,
  yaw: 0,
  pitch: 0
};

function readState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    const obj = raw ? JSON.parse(raw) : null;
    if (obj && obj.worlds && typeof obj.worlds === 'object') return obj;
  } catch (error) {
    console.warn('Sauvegarde illisible :', error);
  }
  return { version: 1, last: null, worlds: {} };
}

function writeState(state) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  } catch (error) {
    console.warn('Sauvegarde impossible :', error);
  }
}

function currentPose() {
  return {
    x: +camera.position.x.toFixed(3),
    y: +camera.position.y.toFixed(3),
    z: +camera.position.z.toFixed(3),
    yaw: +camYaw.toFixed(4),
    pitch: +camPitch.toFixed(4)
  };
}

function applyPose(p) {
  if (!p || !Number.isFinite(p.x) || !Number.isFinite(p.z)) return false;

  camera.position.set(p.x, Number.isFinite(p.y) ? p.y : 1.7, p.z);
  camYaw = Number.isFinite(p.yaw) ? p.yaw : 0;
  camPitch = THREE.MathUtils.clamp(Number.isFinite(p.pitch) ? p.pitch : 0, -1, 1);

  camera.rotation.y = camYaw;
  camera.rotation.x = camPitch;
  return true;
}

function saveNow() {

  // Le monde peut ajouter son état (étage, rue...) ou refuser de sauvegarder
  // (ex. pendant le trajet en ascenseur) en renvoyant false.
  let extra = null;

  if (world && typeof world.getSaveState === 'function') {
    try {
      extra = world.getSaveState();
    } catch (error) {
      extra = null;
    }
    if (extra === false) return;
  }

  const state = readState();
  state.version = 2;
  state.last = worldFile;
  state.worlds[worldFile] = Object.assign(currentPose(), {
    t: Date.now(),
    extra: extra
  });
  writeState(state);
}

function applyWorldState(saved) {
  if (world && typeof world.applySaveState === 'function') {
    try {
      world.applySaveState(saved ? (saved.extra || null) : null, saved || null);
    } catch (error) {
      console.warn('Etat du monde non restauré :', error);
    }
  }
}

// ==========================================
// 8b. CARTE (routes, lieux, camion, joueur)
// ==========================================
// Le monde fournit world.getMapData() :
//   { bounds, roads:[{w, pts:[[x,z],...]}], lakes:[{x,z,r}],
//     pois:[{type:'work'|'home', x, z, label}], truck:{x,z,heading}|null,
//     player:{x,z,inside?} }
// Nord = haut. On peut déplacer la carte (glisser), zoomer (molette / pincement / + -),
// et l'agrandir avec le bouton ⤢.

const mapPanel = document.getElementById('mapPanel');
const mapCanvas = document.getElementById('mapCanvas');
const mapCtx = mapCanvas.getContext('2d');

const mapView = { cx: 0, cz: 0, scale: 0.3, fitted: false, fitScale: 0.3 };
let mapDpr = 1;

function resizeMapCanvas() {
  mapDpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = mapCanvas.getBoundingClientRect();
  const w = Math.max(16, Math.round(r.width * mapDpr));
  const h = Math.max(16, Math.round(r.height * mapDpr));
  if (mapCanvas.width !== w || mapCanvas.height !== h) {
    mapCanvas.width = w;
    mapCanvas.height = h;
  }
}

function fitMap(d) {
  let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
  const add = (x, z) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); };
  (d.roads || []).forEach(r => r.pts.forEach(p => add(p[0], p[1])));
  (d.pois || []).forEach(p => add(p.x, p.z));
  (d.lakes || []).forEach(l => { add(l.x - l.r, l.z - l.r); add(l.x + l.r, l.z + l.r); });
  if (x0 > x1) { x0 = -100; x1 = 100; z0 = -100; z1 = 100; }
  const bw = Math.max(50, x1 - x0), bh = Math.max(50, z1 - z0);
  mapView.cx = (x0 + x1) / 2;
  mapView.cz = (z0 + z1) / 2;
  mapView.fitScale = Math.min(mapCanvas.width / (bw * 1.18), mapCanvas.height / (bh * 1.18));
  mapView.scale = mapView.fitScale;
  mapView.fitted = true;
}

function clampScale(v) {
  return Math.max(mapView.fitScale * 0.5, Math.min(8 * mapDpr, v));
}

function zoomMapAt(factor, sx, sy) {
  const w = mapCanvas.width, h = mapCanvas.height;
  const wx = mapView.cx + (sx - w / 2) / mapView.scale;
  const wz = mapView.cz + (sy - h / 2) / mapView.scale;
  mapView.scale = clampScale(mapView.scale * factor);
  mapView.cx = wx - (sx - w / 2) / mapView.scale;
  mapView.cz = wz - (sy - h / 2) / mapView.scale;
}

function drawMap() {

  resizeMapCanvas();

  const W = mapCanvas.width, H = mapCanvas.height;
  const c = mapCtx;

  c.fillStyle = '#0d1013';
  c.fillRect(0, 0, W, H);

  if (!world || typeof world.getMapData !== 'function') {
    c.fillStyle = '#777';
    c.font = (12 * mapDpr) + 'px monospace';
    c.textAlign = 'center';
    c.fillText('MAP UNAVAILABLE', W / 2, H / 2);
    return;
  }

  const d = world.getMapData();
  if (!mapView.fitted) fitMap(d);

  const S = mapView.scale;
  const X = x => W / 2 + (x - mapView.cx) * S;
  const Y = z => H / 2 + (z - mapView.cz) * S;

  // Zone du monde
  if (d.bounds) {
    c.fillStyle = '#141a1d';
    c.fillRect(X(d.bounds.x0), Y(d.bounds.z0), (d.bounds.x1 - d.bounds.x0) * S, (d.bounds.z1 - d.bounds.z0) * S);
  }

  // Quadrillage de 100 m
  if (S * 100 > 22 * mapDpr) {
    c.strokeStyle = 'rgba(255,255,255,0.05)';
    c.lineWidth = 1;
    const gx0 = Math.floor((mapView.cx - W / 2 / S) / 100) * 100;
    const gx1 = mapView.cx + W / 2 / S;
    const gz0 = Math.floor((mapView.cz - H / 2 / S) / 100) * 100;
    const gz1 = mapView.cz + H / 2 / S;
    c.beginPath();
    for (let gx = gx0; gx <= gx1; gx += 100) { c.moveTo(X(gx), 0); c.lineTo(X(gx), H); }
    for (let gz = gz0; gz <= gz1; gz += 100) { c.moveTo(0, Y(gz)); c.lineTo(W, Y(gz)); }
    c.stroke();
  }

  // Lacs gelés
  (d.lakes || []).forEach(l => {
    c.beginPath();
    c.arc(X(l.x), Y(l.z), l.r * S, 0, Math.PI * 2);
    c.fillStyle = '#25414f';
    c.fill();
    c.strokeStyle = '#3d6678';
    c.lineWidth = 1.5 * mapDpr;
    c.stroke();
  });

  // Routes : liseré sombre puis chaussée claire
  c.lineCap = 'round';
  c.lineJoin = 'round';
  const drawRoads = (extra, color) => {
    (d.roads || []).forEach(r => {
      c.beginPath();
      r.pts.forEach((p, i) => { if (i === 0) c.moveTo(X(p[0]), Y(p[1])); else c.lineTo(X(p[0]), Y(p[1])); });
      c.lineWidth = Math.max(2 * mapDpr, r.w * S) + extra;
      c.strokeStyle = color;
      c.stroke();
    });
  };
  drawRoads(3 * mapDpr, '#2a2f33');
  drawRoads(0, '#c7ccd0');

  // Lieux
  const u = mapDpr;
  (d.pois || []).forEach(p => {
    const x = X(p.x), y = Y(p.z);
    if (p.type === 'work') {
      c.fillStyle = '#ffcf6b';
      c.strokeStyle = '#2a2f33';
      c.lineWidth = 2 * u;
      c.beginPath();
      c.moveTo(x, y - 12 * u);
      c.lineTo(x + 11 * u, y - 2 * u);
      c.lineTo(x + 8 * u, y - 2 * u);
      c.lineTo(x + 8 * u, y + 8 * u);
      c.lineTo(x - 8 * u, y + 8 * u);
      c.lineTo(x - 8 * u, y - 2 * u);
      c.lineTo(x - 11 * u, y - 2 * u);
      c.closePath();
      c.stroke();
      c.fill();
    } else {
      c.fillStyle = '#8fb7d9';
      c.strokeStyle = '#2a2f33';
      c.lineWidth = 2 * u;
      c.strokeRect(x - 6 * u, y - 10 * u, 12 * u, 18 * u);
      c.fillRect(x - 6 * u, y - 10 * u, 12 * u, 18 * u);
      c.fillStyle = '#2a2f33';
      for (let i = 0; i < 3; i++) {
        c.fillRect(x - 3.5 * u, y - 7 * u + i * 5 * u, 2.5 * u, 2.5 * u);
        c.fillRect(x + 1 * u, y - 7 * u + i * 5 * u, 2.5 * u, 2.5 * u);
      }
    }
    if (p.label) {
      c.font = 'bold ' + (11 * u) + 'px monospace';
      c.textAlign = 'center';
      c.lineWidth = 3 * u;
      c.strokeStyle = '#0d1013';
      c.strokeText(p.label, x, y + 22 * u);
      c.fillStyle = p.type === 'work' ? '#ffd98a' : '#a9cbe8';
      c.fillText(p.label, x, y + 22 * u);
    }
  });

  // Camion
  if (d.truck) {
    const x = X(d.truck.x), y = Y(d.truck.z);
    const a = Math.atan2(-Math.cos(d.truck.heading), -Math.sin(d.truck.heading));
    c.save();
    c.translate(x, y);
    c.rotate(a);
    c.fillStyle = '#c4452f';
    c.strokeStyle = '#0d1013';
    c.lineWidth = 2 * u;
    c.beginPath();
    c.rect(-7 * u, -4 * u, 14 * u, 8 * u);
    c.stroke();
    c.fill();
    c.fillStyle = '#f0d9b5';
    c.fillRect(2 * u, -3 * u, 4 * u, 6 * u);
    c.restore();
  }

  // Joueur (flèche rouge qui pulse)
  if (d.player) {
    const px = X(d.player.x), py = Y(d.player.z);
    const yaw = camYaw;
    const a = Math.atan2(-Math.cos(yaw), -Math.sin(yaw));
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 280);

    c.beginPath();
    c.arc(px, py, (9 + pulse * 6) * u, 0, Math.PI * 2);
    c.fillStyle = 'rgba(255,80,80,' + (0.22 - pulse * 0.12) + ')';
    c.fill();

    if (!d.player.inside) {
      c.save();
      c.translate(px, py);
      c.rotate(a);
      c.beginPath();
      c.moveTo(9 * u, 0);
      c.lineTo(-6 * u, -6 * u);
      c.lineTo(-3 * u, 0);
      c.lineTo(-6 * u, 6 * u);
      c.closePath();
      c.fillStyle = '#ff5a4d';
      c.strokeStyle = '#fff';
      c.lineWidth = 1.6 * u;
      c.stroke();
      c.fill();
      c.restore();
    } else {
      c.beginPath();
      c.arc(px, py, 4 * u, 0, Math.PI * 2);
      c.fillStyle = '#ff5a4d';
      c.fill();
    }
  }

  // Échelle
  const nice = [10, 20, 50, 100, 200, 500, 1000];
  let len = nice[0];
  for (const n of nice) { if (n * S <= W * 0.28) len = n; }
  c.strokeStyle = '#ddd0c3';
  c.fillStyle = '#ddd0c3';
  c.lineWidth = 2 * u;
  c.beginPath();
  c.moveTo(10 * u, H - 12 * u);
  c.lineTo(10 * u + len * S, H - 12 * u);
  c.stroke();
  c.font = (10 * u) + 'px monospace';
  c.textAlign = 'left';
  c.fillText(len + ' m', 10 * u, H - 17 * u);
}

// Interactions : glisser, molette, pincement, boutons
const mapPointers = new Map();
let mapPinch = 0;

mapCanvas.addEventListener('pointerdown', e => {
  mapCanvas.setPointerCapture(e.pointerId);
  mapPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  mapPinch = 0;
  mapCanvas.style.cursor = 'grabbing';
});

mapCanvas.addEventListener('pointermove', e => {
  const prev = mapPointers.get(e.pointerId);
  if (!prev) return;
  const cur = { x: e.clientX, y: e.clientY };

  if (mapPointers.size === 1) {
    mapView.cx -= (cur.x - prev.x) * mapDpr / mapView.scale;
    mapView.cz -= (cur.y - prev.y) * mapDpr / mapView.scale;
  } else if (mapPointers.size === 2) {
    mapPointers.set(e.pointerId, cur);
    const pts = [...mapPointers.values()];
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (mapPinch > 0 && dist > 0) {
      const r = mapCanvas.getBoundingClientRect();
      const mx = ((pts[0].x + pts[1].x) / 2 - r.left) * mapDpr;
      const my = ((pts[0].y + pts[1].y) / 2 - r.top) * mapDpr;
      zoomMapAt(dist / mapPinch, mx, my);
    }
    mapPinch = dist;
  }
  mapPointers.set(e.pointerId, cur);
});

function endMapPointer(e) {
  mapPointers.delete(e.pointerId);
  mapPinch = 0;
  if (mapPointers.size === 0) mapCanvas.style.cursor = 'grab';
}
mapCanvas.addEventListener('pointerup', endMapPointer);
mapCanvas.addEventListener('pointercancel', endMapPointer);

mapCanvas.addEventListener('wheel', e => {
  e.preventDefault();
  const r = mapCanvas.getBoundingClientRect();
  zoomMapAt(e.deltaY < 0 ? 1.2 : 1 / 1.2, (e.clientX - r.left) * mapDpr, (e.clientY - r.top) * mapDpr);
}, { passive: false });

document.getElementById('mapZoomIn').addEventListener('click', () => zoomMapAt(1.4, mapCanvas.width / 2, mapCanvas.height / 2));
document.getElementById('mapZoomOut').addEventListener('click', () => zoomMapAt(1 / 1.4, mapCanvas.width / 2, mapCanvas.height / 2));
document.getElementById('mapFit').addEventListener('click', () => { mapView.fitted = false; });
document.getElementById('mapMe').addEventListener('click', () => {
  if (!world || typeof world.getMapData !== 'function') return;
  const d = world.getMapData();
  if (!d.player) return;
  mapView.cx = d.player.x;
  mapView.cz = d.player.z;
  mapView.scale = clampScale(Math.max(mapView.scale, 1.4 * mapDpr));
});

document.getElementById('mapExpand').addEventListener('click', () => {
  mapPanel.classList.toggle('expanded');
  mapView.fitted = false;   // on recadre toute la carte à la nouvelle taille
});

// COPY COORDINATES

document.getElementById('copyBtn')
.addEventListener('click', async () => {

  const p = camera.position;

  const text =
    `X:${p.x.toFixed(2)} Y:${p.y.toFixed(2)} Z:${p.z.toFixed(2)}`;

  try {

    await navigator.clipboard.writeText(text);

    document.getElementById('copyBtn').textContent = 'COPIED';

    setTimeout(() => {
      document.getElementById('copyBtn').textContent = 'COPY';
    }, 1200);

  } catch(error) {

    console.error('Clipboard unavailable:', error);

  }
});

// ==========================================
// 9. RESIZE
// ==========================================

function resize() {

  const w = window.innerWidth;
  const h = Math.max(1, window.innerHeight - 70);

  renderer.setSize(w, h);

  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

window.addEventListener('resize', resize);
resize();

// ==========================================
// 10. ANIMATION
// ==========================================

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);

  // SKY FOLLOWS CAMERA

  skySphere.position.copy(camera.position);

  skyUniforms.uTime.value = clock.elapsedTime;

  // CAMERA ROTATION

  camera.rotation.y = camYaw;
  camera.rotation.x = camPitch;

  // FORWARD / BACKWARD

  const forward = new THREE.Vector3(
    -Math.sin(camYaw),
    0,
    -Math.cos(camYaw)
  );

  // LEFT / RIGHT

  const right = new THREE.Vector3(
    Math.cos(camYaw),
    0,
    -Math.sin(camYaw)
  );

  // Joystick gauche + clavier (ZQSD / WASD / flèches)
  input.lx = THREE.MathUtils.clamp(jLx + (keys.right ? 1 : 0) - (keys.left ? 1 : 0), -1, 1);
  input.ly = THREE.MathUtils.clamp(jLy + (keys.down ? 1 : 0) - (keys.up ? 1 : 0), -1, 1);

  // Au volant, c'est le monde (le camion) qui déplace la caméra
  const driving = !!(world && typeof world.isDriving === 'function' && world.isDriving());

  if (!driving) {
    camera.position.addScaledVector(
      forward, -input.ly * 6.5 * dt
    );

    camera.position.addScaledVector(
      right, input.lx * 6.5 * dt
    );
  }

  // CONSTANT HEIGHT (sauf si le monde gère lui-même la hauteur : étages, collines...)

  if (!(world && world.controlsHeight)) {
    camera.position.y = 1.7;
  }

  // RIGHT JOYSTICK CAMERA ROTATION

  camYaw -= jRx * 1.8 * dt;

  camPitch = THREE.MathUtils.clamp(
    camPitch - jRy * 1.2 * dt,
    -1,
    1
  );

  // COORDINATES

  if (
    document.getElementById('coordPanel').style.display === 'block'
  ) {

    document.getElementById('cx').textContent =
      camera.position.x.toFixed(2);

    document.getElementById('cy').textContent =
      camera.position.y.toFixed(2);

    document.getElementById('cz').textContent =
      camera.position.z.toFixed(2);
  }

  // SHARED SNOW

  snow.update(dt, clock.elapsedTime);

  // MAP (seulement si le panneau est ouvert)

  if (mapPanel.style.display === 'block') drawMap();

  // WORLD UPDATE

  if (world && typeof world.update === 'function') {
    world.update(dt, clock.elapsedTime);
  }

  // SAVE POSITION (après le monde, pour enregistrer la vraie hauteur)

  savePosition(dt);

  renderer.render(scene, camera);

  // JOYSTICKS

  drawJoy('jL', jLx, jLy);
  drawJoy('jR', jRx, jRy);
}

animate();

</script>
