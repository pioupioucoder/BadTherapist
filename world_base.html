* {

html, body {

  top: 0;
  left: 0;
  width: 100%;

/* HUD */

#homeButton {

}

  top: 14px;
  right: 14px;

  align-items: center;
  gap: 9px;

}

.hud-icon {

  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(23, 23, 32, 0.9);
  border: 1px solid #625047;
  border-radius: 10px;
  color: #d9c5b5;
  cursor: pointer;
  transition: 0.2s;
}

.hud-icon:hover,
.hud-icon:active {

  color: white;
}

.hud-icon svg {
  width: 21px;
  height: 21px;

  stroke-linecap: round;

}

/* PANELS */

.hud-panel {
  display: none;
  position: fixed;
  top: 68px;
  right: 14px;
  width: min(280px, calc(100vw - 28px));
  padding: 16px;
  background: rgba(23, 23, 32, 0.97);

  border-radius: 10px;
  color: #ddd0c3;
  z-index: 40;
  font: 12px/1.8 monospace;
}

.panel-title {

  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  color: #d9c5b5;
  letter-spacing: 1px;
}

.panel-close {

  border: none;
  color: #aaa;

}

#copyBtn {

  padding: 6px;

}

#inventoryGrid {

  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.inventory-slot {
  aspect-ratio: 1;
  background: rgba(255, 255, 255, 0.025);

  border-radius: 5px;
}

#mapPlaceholder {

  justify-content: center;
  border: 1px dashed #625047;
  color: #777;
  letter-spacing: 2px;

/* JOYSTICKS */

#hud {

  bottom: 0;
  left: 0;

  height: 70px;

  align-items: center;
  z-index: 20;
}

#jL, #jR {
  width: 120px;
  height: 60px;
  touch-action: none;
}

/* ERROR */

#errorPanel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #111722;
  color: #eee;
  padding: 25px;
  align-items: center;
  justify-content: center;
  text-align: center;
  font: 14px/1.7 monospace;
  white-space: pre-wrap;
}

/* MOBILE */

@media (max-width: 480px) {
  #homeButton {

  #moneyDisplay {
    padding: 9px 8px;
    font-size: 12px;
  }

  .hud-panel {
    top: 58px;
    right: 8px;
  }

<script type="module">

import * as THREE from 'three';

// ==========================================
// 1. SCENE
// ==========================================

const canvas = document.getElementById('gc');

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'low-power'
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 1.5)
);

renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();

scene.fog = new THREE.FogExp2(
  0xb4b8b9,
  0.00045
);

const camera = new THREE.PerspectiveCamera(
  65,
  1,
  0.1,
  5000
);

camera.position.set(0, 1.7, 13);
camera.rotation.order = 'YXZ';

// ==========================================
// 2. SHARED SKY - OVERCAST WINTER AFTERNOON
// ==========================================

const skyUniforms = {
  uTime: { value: 0 }
};

const skyMaterial = new THREE.ShaderMaterial({

  uniforms: skyUniforms,
  side: THREE.BackSide,
  depthWrite: false,

  vertexShader: `
    varying vec3 vDirection;

    void main() {
      vDirection = position;

      gl_Position = projectionMatrix *
                    modelViewMatrix *
                    vec4(position, 1.0);
    }
  `,

  fragmentShader: `

    varying vec3 vDirection;
    uniform float uTime;

    // ======================================
    // NOISE
    // ======================================

    float hash(vec3 p) {
      p = fract(p * 0.3183099 + vec3(0.1));
      p *= 17.0;
      return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
    }

    float noise(vec3 p) {

      vec3 i = floor(p);
      vec3 f = fract(p);

      f = f * f * (3.0 - 2.0 * f);

      float n000 = hash(i);
      float n100 = hash(i + vec3(1.0,0.0,0.0));
      float n010 = hash(i + vec3(0.0,1.0,0.0));
      float n110 = hash(i + vec3(1.0,1.0,0.0));

      float n001 = hash(i + vec3(0.0,0.0,1.0));
      float n101 = hash(i + vec3(1.0,0.0,1.0));
      float n011 = hash(i + vec3(0.0,1.0,1.0));
      float n111 = hash(i + vec3(1.0,1.0,1.0));

      float x00 = mix(n000,n100,f.x);
      float x10 = mix(n010,n110,f.x);
      float x01 = mix(n001,n101,f.x);
      float x11 = mix(n011,n111,f.x);

      float y0 = mix(x00,x10,f.y);
      float y1 = mix(x01,x11,f.y);

      return mix(y0,y1,f.z);
    }

    float fbm(vec3 p) {

      float value = 0.0;
      float amplitude = 0.5;

      for(int i = 0; i < 5; i++) {

        value += noise(p) * amplitude;

        p *= 2.0;
        amplitude *= 0.5;
      }

      return value;
    }

    // ======================================
    // SKY
    // ======================================

    void main() {

      vec3 dir = normalize(vDirection);

      float h = dir.y;

      // Subtle blue atmosphere behind the clouds.
      // Blue is intentionally very restrained.

      vec3 horizonBlue = vec3(0.43, 0.49, 0.53);
      vec3 middleBlue  = vec3(0.37, 0.46, 0.53);
      vec3 upperBlue   = vec3(0.34, 0.43, 0.50);

      vec3 sky = mix(
        horizonBlue,
        middleBlue,
        smoothstep(-0.18, 0.25, h)
      );

      sky = mix(
        sky,
        upperBlue,
        smoothstep(0.25, 0.85, h)
      );

      // ======================================
      // CLOUD MOVEMENT
      // ======================================

      vec3 cloudPosition = dir * 3.2;

      // Slow, horizontal movement.
      cloudPosition.x += uTime * 0.006;
      cloudPosition.z += uTime * 0.0015;

      // ======================================
      // LARGE DISTANT CLOUD MASSES
      // ======================================

      float largeClouds = fbm(cloudPosition);

      // A high coverage threshold keeps
      // most of the blue hidden.

      float cloudCoverage = smoothstep(
        0.31,
        0.49,
        largeClouds
      );

      // ======================================
      // SMALLER CLOUD DETAILS
      // ======================================

      vec3 detailPosition = dir * 10.0;

      detailPosition.x += uTime * 0.009;
      detailPosition.z += uTime * 0.002;

      float cloudDetails = fbm(detailPosition);

      // Additional soft, distant cloud texture.

      float fineClouds = noise(
        dir * 24.0 +
        vec3(uTime * 0.012, 0.0, uTime * 0.003)
      );

      float cloudTexture =
        largeClouds * 0.72 +
        cloudDetails * 0.20 +
        fineClouds * 0.08;

      // ======================================
      // CLOUD DISTRIBUTION
      // ======================================

      float cloudZone = smoothstep(
        -0.24,
        -0.02,
        h
      );

      // Clouds cover the upper sky too,
      // without looking like a flat ceiling.

      float upperCoverage = smoothstep(
        -0.15,
        0.35,
        h
      );

      float coverage = mix(
        0.91,
        0.82,
        upperCoverage
      );

      float clouds = smoothstep(
        coverage - 0.13,
        coverage + 0.10,
        cloudTexture
      );

      // Keep the horizon heavily overcast.

      float cloudMask = mix(
        clouds,
        max(clouds, 0.78),
        smoothstep(-0.25, 0.02, h)
      );

      // ======================================
      // CLOUD COLORS
      // ======================================

      // Soft white-grey cloud tops.

      vec3 cloudLight = vec3(
        0.72,
        0.73,
        0.72
      );

      // Natural grey undersides.

      vec3 cloudShadow = vec3(
        0.43,
        0.45,
        0.46
      );

      // Slightly warmer clouds near sunset.

      vec3 cloudWarm = vec3(
        0.67,
        0.59,
        0.52
      );

      // Variation between cloud tops and shadows.

      float cloudBrightness = smoothstep(
        0.36,
        0.68,
        cloudDetails
      );

      vec3 cloudColor = mix(
        cloudShadow,
        cloudLight,
        cloudBrightness
      );

      // ======================================
      // LATE AFTERNOON LIGHT
      // ======================================

      // A very subtle warm glow near the horizon.

      float sunsetGlow = exp(
        -pow((h + 0.035) * 5.0, 2.0)
      );

      // Restrict the orange tint to a portion
      // of the horizon.

      float sunsetDirection = smoothstep(
        -0.65,
        0.65,
        dir.x
      );

      float warmLight =
        sunsetGlow *
        sunsetDirection *
        0.28;

      cloudColor = mix(
        cloudColor,
        cloudWarm,
        warmLight
      );

      // Slightly darker cloud undersides.

      float underside = smoothstep(
        0.0,
        0.5,
        -h
      );

      cloudColor *= 1.0 - underside * 0.10;

      // ======================================
      // FINAL CLOUD BLENDING
      // ======================================

      sky = mix(
        sky,
        cloudColor,
        cloudMask * cloudZone
      );

      // A soft atmospheric grey near the horizon.

      float horizonMist = exp(
        -pow((h + 0.10) * 4.0, 2.0)
      );

      vec3 mistColor = vec3(
        0.58,
        0.57,
        0.55
      );

      mistColor = mix(
        mistColor,
        vec3(0.62, 0.54, 0.47),
        sunsetDirection * 0.22
      );

      sky = mix(
        sky,
        mistColor,
        horizonMist * 0.18
      );

      gl_FragColor = vec4(sky, 1.0);
    }
  `
});

// ==========================================
// SKY SPHERE
// ==========================================

const skySphere = new THREE.Mesh(
  new THREE.SphereGeometry(1800, 64, 48),
  skyMaterial
);

skySphere.frustumCulled = false;
skySphere.renderOrder = -100;

scene.add(skySphere);
// ==========================================
// 3. GLOBAL LIGHTING
// ==========================================

// Soft late-afternoon daylight.

scene.add(
  new THREE.AmbientLight(
    0xc2c5c5,
    0.55
  )
);

// Sky light: cold and diffuse.

const hemisphere = new THREE.HemisphereLight(
  0xd2d8dc,
  0x777575,
  0.68
);

scene.add(hemisphere);

// Weak sunlight filtered by thick clouds.

const daylight = new THREE.DirectionalLight(
  0xd5d4cf,
  0.38
);

daylight.position.set(
  -80,
  35,
  -100
);

scene.add(daylight);

// ==========================================
// 4. WORLD LOADING
// ==========================================

const params = new URLSearchParams(
  window.location.search
);

const worldFile = params.get('world') || 'bedroom.js';

let world;

try {

  const worldModule = await import(
    new URL(worldFile, window.location.href).href
  );

  if (typeof worldModule.buildWorld !== 'function') {
    throw new Error(
      'Le fichier du décor doit exporter buildWorld(scene).'
    );
  }

 world = worldModule.buildWorld(scene, {
  camera,
  renderer
});

} catch (error) {

  console.error('Erreur de chargement du décor :', error);

  const panel = document.getElementById('errorPanel');

  panel.style.display = 'flex';

  panel.textContent =
    'Impossible de charger le décor : ' +
    worldFile +
    '\n\n' +
    error.message;
}

// ==========================================
// 5. JOYSTICKS
// ==========================================

let jLx = 0;
let jLy = 0;
let jRx = 0;
let jRy = 0;

function setupJoy(id, callback) {

  const cv = document.getElementById(id);

  let active = false;
  let bx = 0;
  let by = 0;

  function position(e) {

    const r = cv.getBoundingClientRect();

    return {
      x: (e.clientX - r.left) * cv.width / r.width,
      y: (e.clientY - r.top) * cv.height / r.height
    };
  }

  function start(e) {

    e.preventDefault();

    const p = position(e);

    bx = p.x;
    by = p.y;

    active = true;

    cv.setPointerCapture(e.pointerId);
  }

  function move(e) {

    if (!active) return;

    e.preventDefault();

    const p = position(e);

    let x = (p.x - bx) / 45;
    let y = (p.y - by) / 22;

    const length = Math.hypot(x, y);

    if (length > 1) {
      x /= length;
      y /= length;
    }

    callback(x, y);
  }

  function end() {
    active = false;
    callback(0, 0);
  }

  cv.addEventListener('pointerdown', start);
  cv.addEventListener('pointermove', move);
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('lostpointercapture', end);
}

setupJoy('jL', (x, y) => {
  jLx = x;
  jLy = y;
});

setupJoy('jR', (x, y) => {
  jRx = x;
  jRy = y;
});

// ==========================================
// 6. JOYSTICK DESIGN
// ==========================================

function drawJoy(id, dx, dy) {

  const cv = document.getElementById(id);
  const ctx = cv.getContext('2d');

  ctx.clearRect(0, 0, 120, 60);

  ctx.fillStyle = '#25232b';

  ctx.beginPath();
  ctx.ellipse(60, 30, 55, 25, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#665b59';
  ctx.lineWidth = 1.3;
  ctx.stroke();

  const x = 60 + dx * 38;
  const y = 30 + dy * 16;

  const gradient = ctx.createRadialGradient(
    x - 3, y - 3, 1,
    x, y, 15
  );

  gradient.addColorStop(0, '#c6bdb2');
  gradient.addColorStop(1, '#655d57');

  ctx.fillStyle = gradient;

  ctx.beginPath();
  ctx.ellipse(x, y, 14, 10, 0, 0, Math.PI * 2);
  ctx.fill();
}

// ==========================================
// 7. CAMERA
// ==========================================

let camYaw = 0;
let camPitch = 0;

let dragging = false;
let lastX = 0;
let lastY = 0;

canvas.addEventListener('pointerdown', e => {

  if (e.pointerType === 'mouse') {

    dragging = true;

    lastX = e.clientX;
    lastY = e.clientY;

    canvas.setPointerCapture(e.pointerId);
  }
});

canvas.addEventListener('pointermove', e => {

  if (!dragging) return;

  camYaw -= (e.clientX - lastX) * 0.004;
  camPitch -= (e.clientY - lastY) * 0.003;

  camPitch = THREE.MathUtils.clamp(
    camPitch, -1, 1
  );

  lastX = e.clientX;
  lastY = e.clientY;
});

canvas.addEventListener('pointerup', () => {
  dragging = false;
});

canvas.addEventListener('pointercancel', () => {
  dragging = false;
});

// ==========================================
// 8. HUD INTERACTIONS
// ==========================================

// HOME

document.getElementById('homeButton')
.addEventListener('click', () => {

  sessionStorage.setItem('bt_intro_position', '0');

  window.location.href = 'index.html';
});

// PANELS

const panels = [
  'coordPanel',
  'itemPanel',
  'mapPanel'
];

function togglePanel(panelId) {

  const selectedPanel = document.getElementById(panelId);

  const isAlreadyOpen =
    selectedPanel.style.display === 'block';

  panels.forEach(id => {
    document.getElementById(id).style.display = 'none';
  });

  selectedPanel.style.display =
    isAlreadyOpen ? 'none' : 'block';
}

document.getElementById('positionButton')
.addEventListener('click', () => {
  togglePanel('coordPanel');
});

document.getElementById('itemButton')
.addEventListener('click', () => {
  togglePanel('itemPanel');
});

document.getElementById('mapButton')
.addEventListener('click', () => {
  togglePanel('mapPanel');
});

// CLOSE PANELS

document.querySelectorAll('.panel-close').forEach(button => {

  button.addEventListener('click', () => {

    document.getElementById(
      button.dataset.close
    ).style.display = 'none';

  });

});

// COPY COORDINATES

document.getElementById('copyBtn')
.addEventListener('click', async () => {

  const p = camera.position;

  const text =
    `X:${p.x.toFixed(2)} Y:${p.y.toFixed(2)} Z:${p.z.toFixed(2)}`;

  try {

    await navigator.clipboard.writeText(text);

    document.getElementById('copyBtn').textContent = 'COPIED';

    setTimeout(() => {
      document.getElementById('copyBtn').textContent = 'COPY';
    }, 1200);

  } catch(error) {

    console.error('Clipboard unavailable:', error);

  }
});

// ==========================================
// 9. RESIZE
// ==========================================

function resize() {

  const w = window.innerWidth;
  const h = Math.max(1, window.innerHeight - 70);

  renderer.setSize(w, h);

  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

window.addEventListener('resize', resize);
resize();

// ==========================================
// 10. ANIMATION
// ==========================================

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);

  // SKY FOLLOWS CAMERA

  skySphere.position.copy(camera.position);

  skyUniforms.uTime.value = clock.elapsedTime;

  // CAMERA ROTATION

  camera.rotation.y = camYaw;
  camera.rotation.x = camPitch;

  // FORWARD / BACKWARD

  const forward = new THREE.Vector3(
    -Math.sin(camYaw),
    0,
    -Math.cos(camYaw)
  );

  // LEFT / RIGHT

  const right = new THREE.Vector3(
    Math.cos(camYaw),
    0,
    -Math.sin(camYaw)
  );

  camera.position.addScaledVector(
    forward, -jLy * 6.5 * dt
  );

  camera.position.addScaledVector(
    right, jLx * 6.5 * dt
  );

  // CONSTANT HEIGHT

  camera.position.y = 1.7;

  // RIGHT JOYSTICK CAMERA ROTATION

  camYaw -= jRx * 1.8 * dt;

  camPitch = THREE.MathUtils.clamp(
    camPitch - jRy * 1.2 * dt,
    -1,
    1
  );

  // COORDINATES

  if (
    document.getElementById('coordPanel').style.display === 'block'
  ) {

    document.getElementById('cx').textContent =
      camera.position.x.toFixed(2);

    document.getElementById('cy').textContent =
      camera.position.y.toFixed(2);

    document.getElementById('cz').textContent =
      camera.position.z.toFixed(2);
  }

  // WORLD UPDATE

  if (world && typeof world.update === 'function') {
    world.update(dt, clock.elapsedTime);
  }

  renderer.render(scene, camera);

  // JOYSTICKS

  drawJoy('jL', jLx, jLy);
  drawJoy('jR', jRx, jRy);
}

animate();

</script>
</body>
</html>
