<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bad Therapist</title>
<link rel="icon" type="image/png" href="./images/logo.png">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111722;
  font-family: Arial, sans-serif;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#gc {
  display: block;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: calc(100% - 70px);
  touch-action: none;
}

/* ==========================================
   HUD
========================================== */

#homeButton {
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 30;
}

#topHud {
  position: fixed;
  top: 14px;
  right: 14px;
  display: flex;
  align-items: center;
  gap: 9px;
  z-index: 30;
}

.hud-icon {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(23, 23, 32, 0.9);
  border: 1px solid #625047;
  border-radius: 10px;
  color: #d9c5b5;
  cursor: pointer;
  transition: 0.2s;
}

.hud-icon:hover,
.hud-icon:active {
  background: #39313b;
  color: white;
}

.hud-icon svg {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#moneyDisplay {
  padding: 11px 13px;
  background: rgba(23, 23, 32, 0.9);
  border: 1px solid #7c3535;
  border-radius: 10px;
  color: #ff5555;
  font: bold 15px monospace;
  white-space: nowrap;
}

/* ==========================================
   PANELS
========================================== */

.hud-panel {
  display: none;
  position: fixed;
  top: 68px;
  right: 14px;
  width: min(280px, calc(100vw - 28px));
  padding: 16px;
  background: rgba(23, 23, 32, 0.97);
  border: 1px solid #625047;
  border-radius: 10px;
  color: #ddd0c3;
  z-index: 40;
  font: 12px/1.8 monospace;
}

.panel-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  color: #d9c5b5;
  letter-spacing: 1px;
}

.panel-close {
  background: none;
  border: none;
  color: #aaa;
  font-size: 20px;
  cursor: pointer;
}

#copyBtn {
  display: block;
  width: 100%;
  padding: 6px;
  margin-top: 7px;
  background: #302733;
  color: white;
  border: 1px solid #625047;
  border-radius: 4px;
  cursor: pointer;
  font: 10px monospace;
}

#inventoryGrid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.inventory-slot {
  aspect-ratio: 1;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid #51464b;
  border-radius: 5px;
}

#mapPlaceholder {
  height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px dashed #625047;
  color: #777;
  letter-spacing: 2px;
}

/* ==========================================
   JOYSTICKS
========================================== */

#hud {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 70px;
  background: rgba(23, 23, 32, 0.96);
  border-top: 1px solid #393541;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 20;
}

#jL, #jR {
  width: 120px;
  height: 60px;
  touch-action: none;
}

/* ==========================================
   ERROR
========================================== */

#errorPanel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #111722;
  color: #eee;
  padding: 25px;
  align-items: center;
  justify-content: center;
  text-align: center;
  font: 14px/1.7 monospace;
  white-space: pre-wrap;
}

/* ==========================================
   MOBILE
========================================== */

@media (max-width: 480px) {

  #homeButton {
    top: 10px;
    left: 8px;
  }

  #topHud {
    top: 10px;
    right: 8px;
    gap: 5px;
  }

  .hud-icon {
    width: 36px;
    height: 36px;
  }

  .hud-icon svg {
    width: 18px;
    height: 18px;
  }

  #moneyDisplay {
    padding: 9px 8px;
    font-size: 12px;
  }

  .hud-panel {
    top: 58px;
    right: 8px;
  }

  #hud {
    height: 70px;
  }

  #jL, #jR {
    width: 120px;
    height: 60px;
  }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"
  }
}
</script>
</head>

<body>

<canvas id="gc"></canvas>

<!-- ==========================================
     HOME BUTTON - LEFT
========================================== -->

<button class="hud-icon" id="homeButton" aria-label="Home" title="Home">
  <svg viewBox="0 0 24 24">
    <path d="m3 10 9-7 9 7"/>
    <path d="M5 9v12h14V9"/>
    <path d="M9 21v-7h6v7"/>
  </svg>
</button>

<!-- ==========================================
     RIGHT HUD
========================================== -->

<div id="topHud">

  <!-- POSITION -->
  <button class="hud-icon" id="positionButton"
          aria-label="Position" title="Position">
    <svg viewBox="0 0 24 24">
      <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
      <circle cx="12" cy="10" r="2.5"/>
    </svg>
  </button>

  <!-- ITEMS -->
  <button class="hud-icon" id="itemButton"
          aria-label="Items" title="Items">
    <svg viewBox="0 0 24 24">
      <path d="M4 7h16v14H4z"/>
      <path d="M8 7V4h8v3"/>
      <path d="M4 12h16"/>
    </svg>
  </button>

  <!-- MAP -->
  <button class="hud-icon" id="mapButton"
          aria-label="Map" title="Map">
    <svg viewBox="0 0 24 24">
      <path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/>
      <path d="M9 3v15"/>
      <path d="M15 6v15"/>
    </svg>
  </button>

  <!-- MONEY -->
  <div id="moneyDisplay">-3000 $</div>

</div>

<!-- ==========================================
     POSITION PANEL
========================================== -->

<div class="hud-panel" id="coordPanel">

  <div class="panel-title">
    <span>POSITION</span>
    <button class="panel-close" data-close="coordPanel">×</button>
  </div>

  X: <span id="cx">0</span><br>
  Y: <span id="cy">1.7</span><br>
  Z: <span id="cz">0</span>

  <button id="copyBtn">COPY</button>

</div>

<!-- ==========================================
     INVENTORY PANEL
========================================== -->

<div class="hud-panel" id="itemPanel">

  <div class="panel-title">
    <span>INVENTORY</span>
    <button class="panel-close" data-close="itemPanel">×</button>
  </div>

  <div id="inventoryGrid">
    <div class="inventory-slot"></div>
    <div class="inventory-slot"></div>
    <div class="inventory-slot"></div>
    <div class="inventory-slot"></div>

    <div class="inventory-slot"></div>
    <div class="inventory-slot"></div>
    <div class="inventory-slot"></div>
    <div class="inventory-slot"></div>

    <div class="inventory-slot"></div>
    <div class="inventory-slot"></div>
    <div class="inventory-slot"></div>
    <div class="inventory-slot"></div>
  </div>

</div>

<!-- ==========================================
     MAP PANEL
========================================== -->

<div class="hud-panel" id="mapPanel">

  <div class="panel-title">
    <span>MAP</span>
    <button class="panel-close" data-close="mapPanel">×</button>
  </div>

  <div id="mapPlaceholder">
    MAP UNAVAILABLE
  </div>

</div>

<!-- ==========================================
     JOYSTICK HUD
========================================== -->

<div id="hud">
  <canvas id="jL" width="120" height="60"></canvas>
  <canvas id="jR" width="120" height="60"></canvas>
</div>

<div id="errorPanel"></div>

<script type="module">

import * as THREE from 'three';

// ==========================================
// 1. SCENE
// ==========================================

const canvas = document.getElementById('gc');

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'low-power'
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 1.5)
);

renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
scene.fog = null;

const camera = new THREE.PerspectiveCamera(
  65,
  1,
  0.1,
  5000
);

camera.position.set(0, 1.7, 13);
camera.rotation.order = 'YXZ';

// ==========================================
// 2. SHARED SKY
// ==========================================

const skyUniforms = {
  uTime: { value: 0 }
};

const skyMaterial = new THREE.ShaderMaterial({

  uniforms: skyUniforms,

  side: THREE.BackSide,

  depthWrite: false,

  vertexShader: `
    varying vec3 vDirection;

    void main() {
      vDirection = position;

      gl_Position = projectionMatrix *
                    modelViewMatrix *
                    vec4(position, 1.0);
    }
  `,

  fragmentShader: `

    varying vec3 vDirection;

    uniform float uTime;

    float hash(vec2 p) {
      return fract(
        sin(dot(p, vec2(127.1,311.7))) *
        43758.5453
      );
    }

    float noise(vec2 p) {

      vec2 i = floor(p);
      vec2 f = fract(p);

      f = f*f*(3.0-2.0*f);

      float a = hash(i);
      float b = hash(i+vec2(1.0,0.0));
      float c = hash(i+vec2(0.0,1.0));
      float d = hash(i+vec2(1.0,1.0));

      return mix(
        mix(a,b,f.x),
        mix(c,d,f.x),
        f.y
      );
    }

    float fbm(vec2 p) {

      float value = 0.0;
      float amplitude = 0.5;

      for(int i=0;i<5;i++) {

        value += noise(p)*amplitude;

        p *= 2.0;
        amplitude *= 0.5;
      }

      return value;
    }

    void main() {

      vec3 dir = normalize(vDirection);

      float h = dir.y;

      vec3 topColor = vec3(0.055,0.075,0.115);
      vec3 upperColor = vec3(0.075,0.095,0.145);
      vec3 middleColor = vec3(0.105,0.115,0.155);
      vec3 lowerColor = vec3(0.145,0.125,0.135);
      vec3 horizonColor = vec3(0.27,0.145,0.105);

      vec3 sky = mix(
        lowerColor,
        middleColor,
        smoothstep(-0.05,0.25,h)
      );

      sky = mix(
        sky,
        upperColor,
        smoothstep(0.25,0.65,h)
      );

      sky = mix(
        sky,
        topColor,
        smoothstep(0.65,1.0,h)
      );

      // HORIZON GLOW

      float horizonGlow = exp(
        -pow((h + 0.105)*8.0,2.0)
      );

      float sunsetSide = smoothstep(
        -0.5,0.8,dir.x
      );

      sky += vec3(0.16,0.065,0.035) *
             horizonGlow *
             sunsetSide;

      // DISTANT CLOUDS

      vec2 cloudUV = vec2(
        dir.x * 3.2,
        dir.y * 5.0
      );

      cloudUV += vec2(
        uTime * 0.0018,
        uTime * 0.00025
      );

      float cloudNoise = fbm(cloudUV);

      float cloudShape = smoothstep(
        0.53,0.78,cloudNoise
      );

      float cloudZone =
        smoothstep(-0.02,0.18,h) *
        (1.0-smoothstep(0.65,0.95,h));

      float cloudOpacity =
        cloudShape * cloudZone * 0.13;

      vec3 cloudColor = vec3(
        0.30,0.29,0.32
      );

      sky = mix(
        sky,
        cloudColor,
        cloudOpacity
      );

      // STARS

      vec2 starUV = dir.xz * 900.0;

      float stars = step(
        0.9975,
        hash(floor(starUV))
      );

      stars *= smoothstep(0.12,0.45,h);

      float twinkle =
        0.55 + 0.45*sin(
          uTime*0.8 + hash(floor(starUV))*20.0
        );

      sky += vec3(0.7,0.68,0.62) *
             stars * twinkle * 0.45;

      gl_FragColor = vec4(sky,1.0);
    }
  `
});

const skySphere = new THREE.Mesh(
  new THREE.SphereGeometry(1800,64,48),
  skyMaterial
);

skySphere.frustumCulled = false;
skySphere.renderOrder = -100;

scene.add(skySphere);

// ==========================================
// 3. GLOBAL LIGHTING
// ==========================================

scene.add(
  new THREE.AmbientLight(0x77758a,0.30)
);

const hemisphere = new THREE.HemisphereLight(
  0x8d91a8,
  0x24212a,
  0.32
);

scene.add(hemisphere);

const moonLight = new THREE.DirectionalLight(
  0xa1a9c2,
  0.32
);

moonLight.position.set(-40,70,-100);
scene.add(moonLight);

// ==========================================
// 4. WORLD LOADING
// ==========================================

const params = new URLSearchParams(
  window.location.search
);

const worldFile = params.get('world') || 'immeuble.js';

let world;

try {

  const worldModule = await import(
    new URL(worldFile, window.location.href).href
  );

  if (typeof worldModule.buildWorld !== 'function') {
    throw new Error(
      'Le fichier du décor doit exporter buildWorld(scene).'
    );
  }

  world = worldModule.buildWorld(scene);

} catch (error) {

  console.error('Erreur de chargement du décor :', error);

  const panel = document.getElementById('errorPanel');

  panel.style.display = 'flex';

  panel.textContent =
    'Impossible de charger le décor : ' +
    worldFile +
    '\n\n' +
    error.message;
}

// ==========================================
// 5. JOYSTICKS
// ==========================================

let jLx = 0;
let jLy = 0;
let jRx = 0;
let jRy = 0;

function setupJoy(id, callback) {

  const cv = document.getElementById(id);

  let active = false;
  let bx = 0;
  let by = 0;

  function position(e) {

    const r = cv.getBoundingClientRect();

    return {
      x: (e.clientX-r.left)*cv.width/r.width,
      y: (e.clientY-r.top)*cv.height/r.height
    };
  }

  function start(e) {

    e.preventDefault();

    const p = position(e);

    bx = p.x;
    by = p.y;

    active = true;

    cv.setPointerCapture(e.pointerId);
  }

  function move(e) {

    if (!active) return;

    e.preventDefault();

    const p = position(e);

    let x = (p.x-bx)/45;
    let y = (p.y-by)/22;

    const length = Math.hypot(x,y);

    if (length > 1) {
      x /= length;
      y /= length;
    }

    callback(x,y);
  }

  function end() {
    active = false;
    callback(0,0);
  }

  cv.addEventListener('pointerdown',start);
  cv.addEventListener('pointermove',move);
  cv.addEventListener('pointerup',end);
  cv.addEventListener('pointercancel',end);
  cv.addEventListener('lostpointercapture',end);
}

setupJoy('jL',(x,y)=>{
  jLx = x;
  jLy = y;
});

setupJoy('jR',(x,y)=>{
  jRx = x;
  jRy = y;
});

// ==========================================
// 6. JOYSTICK DESIGN
// ==========================================

function drawJoy(id,dx,dy) {

  const cv = document.getElementById(id);
  const ctx = cv.getContext('2d');

  ctx.clearRect(0,0,120,60);

  ctx.fillStyle = '#25232b';

  ctx.beginPath();
  ctx.ellipse(60,30,55,25,0,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = '#665b59';
  ctx.lineWidth = 1.3;
  ctx.stroke();

  const x = 60+dx*38;
  const y = 30+dy*16;

  const gradient = ctx.createRadialGradient(
    x-3,y-3,1,x,y,15
  );

  gradient.addColorStop(0,'#c6bdb2');
  gradient.addColorStop(1,'#655d57');

  ctx.fillStyle = gradient;

  ctx.beginPath();
  ctx.ellipse(x,y,14,10,0,0,Math.PI*2);
  ctx.fill();
}

// ==========================================
// 7. CAMERA
// ==========================================

let camYaw = 0;
let camPitch = 0;

let dragging = false;
let lastX = 0;
let lastY = 0;

canvas.addEventListener('pointerdown',e=>{

  if (e.pointerType === 'mouse') {

    dragging = true;

    lastX = e.clientX;
    lastY = e.clientY;

    canvas.setPointerCapture(e.pointerId);
  }
});

canvas.addEventListener('pointermove',e=>{

  if (!dragging) return;

  camYaw -= (e.clientX-lastX)*0.004;
  camPitch -= (e.clientY-lastY)*0.003;

  camPitch = THREE.MathUtils.clamp(
    camPitch,-1,1
  );

  lastX = e.clientX;
  lastY = e.clientY;
});

canvas.addEventListener('pointerup',()=>{
  dragging = false;
});

canvas.addEventListener('pointercancel',()=>{
  dragging = false;
});

// ==========================================
// 8. HUD INTERACTIONS
// ==========================================

// HOME: RETURN TO MENU AND RESTART INTRO MUSIC

document.getElementById('homeButton')
.addEventListener('click', () => {

  // Reset the intro music position.
  // The accepted state is preserved.

  sessionStorage.setItem('bt_intro_position', '0');

  window.location.href = 'index.html';
});

// PANELS

const panels = [
  'coordPanel',
  'itemPanel',
  'mapPanel'
];

function togglePanel(panelId) {

  const selectedPanel = document.getElementById(panelId);

  const isAlreadyOpen =
    selectedPanel.style.display === 'block';

  panels.forEach(id => {
    document.getElementById(id).style.display = 'none';
  });

  selectedPanel.style.display =
    isAlreadyOpen ? 'none' : 'block';
}

// POSITION

document.getElementById('positionButton')
.addEventListener('click', () => {
  togglePanel('coordPanel');
});

// ITEMS

document.getElementById('itemButton')
.addEventListener('click', () => {
  togglePanel('itemPanel');
});

// MAP

document.getElementById('mapButton')
.addEventListener('click', () => {
  togglePanel('mapPanel');
});

// CLOSE PANELS

document.querySelectorAll('.panel-close').forEach(button => {

  button.addEventListener('click', () => {

    document.getElementById(
      button.dataset.close
    ).style.display = 'none';

  });

});

// COPY COORDINATES

document.getElementById('copyBtn')
.addEventListener('click', async () => {

  const p = camera.position;

  const text =
    `X:${p.x.toFixed(2)} Y:${p.y.toFixed(2)} Z:${p.z.toFixed(2)}`;

  try {

    await navigator.clipboard.writeText(text);

    document.getElementById('copyBtn').textContent = 'COPIED';

    setTimeout(() => {
      document.getElementById('copyBtn').textContent = 'COPY';
    }, 1200);

  } catch(error) {

    console.error('Clipboard unavailable:',error);

  }
});

// ==========================================
// 9. RESIZE
// ==========================================

function resize() {

  const w = window.innerWidth;
  const h = Math.max(1,window.innerHeight-70);

  renderer.setSize(w,h);

  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}

window.addEventListener('resize',resize);
resize();

// ==========================================
// 10. ANIMATION
// ==========================================

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(),0.05);

  // SKY FOLLOWS CAMERA

  skySphere.position.copy(camera.position);

  skyUniforms.uTime.value = clock.elapsedTime;

  // CAMERA ROTATION

  camera.rotation.y = camYaw;
  camera.rotation.x = camPitch;

  // FORWARD / BACKWARD MOVEMENT

  const forward = new THREE.Vector3(
    -Math.sin(camYaw),
    0,
    -Math.cos(camYaw)
  );

  // LEFT / RIGHT MOVEMENT

  const right = new THREE.Vector3(
    Math.cos(camYaw),
    0,
    -Math.sin(camYaw)
  );

  camera.position.addScaledVector(
    forward,-jLy*6.5*dt
  );

  camera.position.addScaledVector(
    right,jLx*6.5*dt
  );

  // CONSTANT HEIGHT

  camera.position.y = 1.7;

  // RIGHT JOYSTICK CAMERA ROTATION

  camYaw -= jRx*1.8*dt;

  camPitch = THREE.MathUtils.clamp(
    camPitch-jRy*1.2*dt,
    -1,
    1
  );

  // COORDINATES

  if (document.getElementById('coordPanel').style.display === 'block') {

    document.getElementById('cx').textContent =
      camera.position.x.toFixed(2);

    document.getElementById('cy').textContent =
      camera.position.y.toFixed(2);

    document.getElementById('cz').textContent =
      camera.position.z.toFixed(2);
  }

  // WORLD UPDATE

  if (world && typeof world.update === 'function') {
    world.update(dt,clock.elapsedTime);
  }

  renderer.render(scene,camera);

  // JOYSTICK DRAWING

  drawJoy('jL',jLx,jLy);
  drawJoy('jR',jRx,jRy);
}

animate();

</script>
</body>
</html>
