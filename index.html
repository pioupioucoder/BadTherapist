<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<link rel="icon" type="image/png" href="./images/logo.png">
<title>Bad Therapist</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<script src="audio-manager.js" defer></script>

<style>
:root {
    --black: #101010;
    --dark: #191919;
    --gray: #777;
    --light: #c9c9c9;
    --white: #ededed;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    background: var(--black);
    color: var(--white);
}

body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: 'VT323', monospace;
    position: relative;
}

.background {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at center, #292929 0%, #171717 48%, #090909 100%);
    z-index: 0;
}

.background::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .18;
    background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 32px 32px;
}

/* Transparent intro image */
.intro-art {
    position: fixed;
    z-index: 1;
    width: min(65vw, 650px);
    max-height: 75svh;
    object-fit: contain;
    object-position: center;
    opacity: .55;
    pointer-events: none;
    user-select: none;
    filter: drop-shadow(0 0 18px rgba(0,0,0,.5));
}

.scanlines {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    opacity: .12;
    background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,.65) 3px,
        rgba(0,0,0,.65) 4px
    );
}

.frame {
    position: fixed;
    inset: 15px;
    border: 1px solid rgba(255,255,255,.13);
    pointer-events: none;
    z-index: 2;
}

.frame::before,
.frame::after {
    content: "";
    position: absolute;
    width: 13px;
    height: 13px;
    border-color: #aaa;
    border-style: solid;
}

.frame::before {
    top: -1px;
    left: -1px;
    border-width: 2px 0 0 2px;
}

.frame::after {
    bottom: -1px;
    right: -1px;
    border-width: 0 2px 2px 0;
}

/* Main menu */
main {
    width: min(700px, 90%);
    text-align: center;
    position: relative;
    z-index: 3;
    padding: 40px 15px;
    animation: boot .9s ease-out both;
}

@keyframes boot {
    from {
        opacity: 0;
        transform: translateY(12px);
        filter: blur(3px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}

.menu-content {
    animation: floating 4s ease-in-out infinite;
}

@keyframes floating {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-9px);
    }
}

.system-label {
    font-size: 19px;
    letter-spacing: .24em;
    color: #858585;
    margin-bottom: 43px;
}

h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(27px, 6vw, 54px);
    line-height: 1.7;
    font-weight: normal;
    letter-spacing: -.07em;
    margin: 0 auto 52px;
    color: var(--white);
    text-shadow:
        3px 3px 0 #555,
        6px 6px 0 rgba(0,0,0,.8);
}

/* E glitch */
.glitch-e {
    display: inline-block;
    position: relative;
    animation: e-glitch 5s infinite steps(1);
}

.glitch-e::before,
.glitch-e::after {
    content: "E";
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
}

.glitch-e::before {
    color: #aaa;
    text-shadow: -3px 0 #fff;
    animation: e-glitch-before 5s infinite steps(1);
}

.glitch-e::after {
    color: #777;
    text-shadow: 3px 0 #ddd;
    animation: e-glitch-after 5s infinite steps(1);
}

@keyframes e-glitch {
    0%, 12%, 14%, 47%, 49%, 100% {
        transform: translate(0);
        opacity: 1;
        filter: none;
    }
    13% {
        transform: translate(3px, -2px) skewX(-12deg);
        opacity: .55;
        filter: blur(1px);
    }
    48% {
        transform: translate(-2px, 1px) scaleY(.8);
        opacity: .7;
        filter: blur(.5px);
    }
}

@keyframes e-glitch-before {
    0%, 12%, 14%, 47%, 49%, 100% {
        opacity: 0;
        transform: translate(0);
    }
    13% {
        opacity: .8;
        transform: translate(-4px, 1px);
    }
    48% {
        opacity: .6;
        transform: translate(3px, -2px);
    }
}

@keyframes e-glitch-after {
    0%, 12%, 14%, 47%, 49%, 100% {
        opacity: 0;
        transform: translate(0);
    }
    13% {
        opacity: .7;
        transform: translate(4px, -1px);
    }
    48% {
        opacity: .8;
        transform: translate(-3px, 2px);
    }
}

.divider {
    width: 180px;
    height: 4px;
    background: #777;
    margin: 0 auto 37px;
    box-shadow:
        0 5px 0 #333,
        0 -5px 0 #333;
}

nav {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 17px;
}

nav a {
    width: 245px;
    padding: 15px 12px;
    text-decoration: none;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: #aaa;
    background: #171717;
    border: 2px solid #555;
    box-shadow: 4px 4px 0 #050505;
    transition: .15s ease;
    position: relative;
}

nav a:hover {
    color: #fff;
    background: #353535;
    border-color: #ddd;
    transform: translate(-2px,-2px);
    box-shadow: 6px 6px 0 #050505;
}

nav a:active {
    transform: translate(3px,3px);
    box-shadow: 1px 1px 0 #050505;
}

nav a::before {
    content: "▶";
    position: absolute;
    left: 15px;
    opacity: 0;
    transition: .15s;
    font-size: 10px;
}

nav a:hover::before {
    opacity: 1;
}

/* Entry question */
#entry-screen {
    position: fixed;
    inset: 0;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px;
    text-align: center;
    background: transparent;
    animation: entry-appear .8s ease both;
}

@keyframes entry-appear {
    from {
        opacity: 0;
        filter: blur(4px);
    }
    to {
        opacity: 1;
        filter: blur(0);
    }
}

#entry-screen.hidden {
    display: none;
}

.entry-question {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(15px, 3vw, 23px);
    line-height: 1.9;
    max-width: 600px;
    margin-bottom: 38px;
    text-shadow: 3px 3px 0 #333;
}

.entry-buttons {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
}

.entry-buttons button {
    width: 150px;
    padding: 15px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: #aaa;
    background: #171717;
    border: 2px solid #555;
    box-shadow: 4px 4px 0 #050505;
    cursor: pointer;
    transition: .15s ease;
}

.entry-buttons button:hover {
    color: #fff;
    background: #353535;
    border-color: #ddd;
    transform: translate(-2px,-2px);
}

.entry-buttons button:active {
    transform: translate(2px,2px);
}

/* Hidden until entry is accepted */
#game-menu.hidden {
    display: none;
}

@media(max-width:480px) {
    h1 {
        font-size: clamp(22px, 7vw, 34px);
    }

    .system-label {
        font-size: 16px;
    }

    nav a {
        width: min(245px, 85vw);
    }

    .intro-art {
        width: 90vw;
        max-height: 65svh;
    }

    .entry-buttons button {
        width: 125px;
    }
}

@media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="background"></div>

<img
    class="intro-art"
    src="images/intro.png"
    alt=""
    draggable="false"
>

<div class="frame"></div>
<div class="scanlines"></div>

<audio id="intro-music" src="audio/intro.mp3" loop preload="auto"></audio>

<!-- First screen -->
<section id="entry-screen">
    <p class="entry-question">Do you wanna waste your time?</p>

    <div class="entry-buttons">
        <button id="yes-button" type="button">YES</button>
        <button id="no-button" type="button">NO</button>
    </div>
</section>

<!-- Main menu -->
<main id="game-menu" class="hidden">
    <div class="menu-content">

        <h1>BAD<br>TH<span class="glitch-e">E</span>RAPIST</h1>

        <div class="divider"></div>

        <nav>
            <a href="world_base.html?launch=1">PLAY</a>
            <a href="settings.html">SETTINGS</a>
        </nav>

    </div>
</main>

<script>
(() => {
    const entryScreen = document.getElementById('entry-screen');
    const gameMenu = document.getElementById('game-menu');
    const yesButton = document.getElementById('yes-button');
    const noButton = document.getElementById('no-button');

    const ACCEPTED_KEY = 'bt_intro_accepted';

    function showMenu() {
        entryScreen.classList.add('hidden');
        gameMenu.classList.remove('hidden');
    }

    // If the player already accepted during this tab session,
    // return directly to the menu.
    if (sessionStorage.getItem(ACCEPTED_KEY) === '1') {
        showMenu();
    }

    yesButton.addEventListener('click', () => {
        sessionStorage.setItem(ACCEPTED_KEY, '1');

        showMenu();

        if (window.BadTherapistAudio) {
            window.BadTherapistAudio.start();
        }
    });

    noButton.addEventListener('click', () => {
        if (window.BadTherapistAudio) {
            window.BadTherapistAudio.stop();
        }

        sessionStorage.removeItem(ACCEPTED_KEY);
        window.location.href = 'https://krismeow.straw.page/';
    });
})();
</script>

</body>
</html>
