<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<link rel="icon" type="image/png" href="images/logo.png">
<title>Bad Therapist</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<style>
:root {
    --black: #101010;
    --dark: #191919;
    --gray: #777;
    --light: #c9c9c9;
    --white: #ededed;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    background: var(--black);
    color: var(--white);
}

body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: 'VT323', monospace;
    position: relative;
}

/* Background */
.background {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at center, #292929 0%, #171717 48%, #090909 100%);
    z-index: 0;
}

.background::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .18;
    background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 32px 32px;
}

/* CRT scanlines */
.scanlines {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    opacity: .12;
    background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,.65) 3px,
        rgba(0,0,0,.65) 4px
    );
}

/* Screen frame */
.frame {
    position: fixed;
    inset: 15px;
    border: 1px solid rgba(255,255,255,.13);
    pointer-events: none;
    z-index: 2;
}

.frame::before,
.frame::after {
    content: "";
    position: absolute;
    width: 13px;
    height: 13px;
    border-color: #aaa;
    border-style: solid;
}

.frame::before {
    top: -1px;
    left: -1px;
    border-width: 2px 0 0 2px;
}

.frame::after {
    bottom: -1px;
    right: -1px;
    border-width: 0 2px 2px 0;
}

/* Main */
main {
    width: min(700px, 90%);
    text-align: center;
    position: relative;
    z-index: 3;
    padding: 40px 15px;
    animation: boot .9s ease-out both;
}

@keyframes boot {
    from {
        opacity: 0;
        transform: translateY(12px);
        filter: blur(3px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}

/* Small top label */
.system-label {
    font-size: 19px;
    letter-spacing: .24em;
    color: #858585;
    margin-bottom: 43px;
}

/* Game title */
h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(27px, 6vw, 54px);
    line-height: 1.7;
    font-weight: normal;
    letter-spacing: -.07em;
    margin: 0 auto 52px;
    color: var(--white);
    text-shadow:
        3px 3px 0 #555,
        6px 6px 0 rgba(0,0,0,.8);
    position: relative;
}

/* Pixel glitch */
.glitch {
    display: inline-block;
    animation: glitch 7s infinite;
}

@keyframes glitch {
    0%, 94%, 96%, 100% {
        transform: translate(0);
        opacity: 1;
    }
    95% {
        transform: translate(3px,-2px);
        opacity: .65;
    }
}

/* Divider */
.divider {
    width: 180px;
    height: 4px;
    background: #777;
    margin: 0 auto 37px;
    box-shadow:
        0 5px 0 #333,
        0 -5px 0 #333;
}

/* Buttons */
nav {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 17px;
}

nav a {
    width: 245px;
    padding: 15px 12px;
    text-decoration: none;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: #aaa;
    background: #171717;
    border: 2px solid #555;
    box-shadow: 4px 4px 0 #050505;
    transition: .15s ease;
    position: relative;
}

nav a:hover {
    color: #fff;
    background: #353535;
    border-color: #ddd;
    transform: translate(-2px,-2px);
    box-shadow: 6px 6px 0 #050505;
}

nav a:active {
    transform: translate(3px,3px);
    box-shadow: 1px 1px 0 #050505;
}

nav a::before {
    content: "▶";
    position: absolute;
    left: 15px;
    opacity: 0;
    transition: .15s;
    font-size: 10px;
}

nav a:hover::before {
    opacity: 1;
}

/* Responsive */
@media(max-width:480px) {
    h1 {
        font-size: clamp(22px, 7vw, 34px);
    }

    .system-label {
        font-size: 16px;
    }

    nav a {
        width: min(245px, 85vw);
    }
}

@media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="frame"></div>
<div class="scanlines"></div>

<main>
    <h1>BAD<br>THERA<span class="glitch">PIST</span></h1>

    <div class="divider"></div>

    <nav>
        <a href="world_base.html?launch=1">PLAY</a>
        <a href="settings.html">SETTINGS</a>
    </nav>
</main>

</body>
</html>
