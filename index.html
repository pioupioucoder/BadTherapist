<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bad Therapist</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#171614; }
    #gc { display:block; width:100%; height:calc(100vh - 70px); cursor:grab; touch-action:none; }
    #gc:active { cursor:grabbing; }
    #hud {
      position:fixed; left:0; right:0; bottom:0; height:70px; z-index:10;
      display:flex; align-items:center; justify-content:space-around; gap:12px;
      padding:0 16px; background:#211f1c; border-top:1px solid #45413b;
    }
    #jL, #jR { display:block; background:#171614; border-radius:9px; touch-action:none; }
    #paramBar { position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:20; }
    .pBtn {
      border:1px solid #71675a; border-radius:20px; padding:7px 15px;
      color:#d1c5b5; background:rgba(25,23,20,.88); font:11px 'Courier New',monospace;
      letter-spacing:1px; cursor:pointer; backdrop-filter:blur(5px);
    }
    .pBtn.active { color:#fff0d8; border-color:#c5a77c; background:rgba(65,52,39,.94); }
    #coordPanel {
      display:none; position:fixed; top:12px; left:12px; z-index:30;
      min-width:170px; padding:9px 12px; border:1px solid #71675a; border-radius:8px;
      background:rgba(22,20,18,.9); color:#d1c5b5; font:12px/1.7 'Courier New',monospace;
      backdrop-filter:blur(5px);
    }
    .coord-title { color:#a9967e; font-size:10px; letter-spacing:2px; margin-bottom:4px; }
    .coord-val { color:#f0dfc5; font-weight:bold; }
    #copyBtn {
      width:100%; margin-top:6px; padding:4px; cursor:pointer; border-radius:4px;
      border:1px solid #756047; background:#34291e; color:#e0c49d;
      font:10px 'Courier New',monospace; letter-spacing:1px;
    }
    #toast {
      position:fixed; left:50%; bottom:86px; transform:translateX(-50%); z-index:40;
      padding:7px 16px; border:1px solid #756047; border-radius:20px;
      background:#29231c; color:#e7d0ad; font:11px 'Courier New',monospace;
      opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap;
    }
    @media (max-width:480px) {
      #hud { padding:0 8px; gap:8px; }
      #jL,#jR { width: min(120px, 43vw); }
    }
  </style>
</head>
<body>
  <canvas id="gc"></canvas>

  <div id="paramBar">
    <button class="pBtn" id="btnCoords" onclick="toggleCoords()">📍 COORDINATES</button>
  </div>
  <div id="coordPanel">
    <div class="coord-title">POSITION 3D</div>
    <div>X : <span class="coord-val" id="cx">0.00</span></div>
    <div>Z : <span class="coord-val" id="cz">0.00</span></div>
    <div>Y : <span class="coord-val" id="cy">1.70</span></div>
    <button id="copyBtn" onclick="copyCoords()">⧉ COPY</button>
  </div>
  <div id="toast">✓ Copied!</div>

  <div id="hud">
    <canvas id="jL" width="120" height="60"></canvas>
    <canvas id="jR" width="120" height="60"></canvas>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { buildBuildingWorld } from './immeuble.js';

    const canvas = document.getElementById('gc');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'low-power' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.setClearColor(0x77716a);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x77716a);
    scene.fog = new THREE.FogExp2(0x77716a, 0.012);

    const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 500);
    camera.position.set(0, 1.7, 13);
    camera.rotation.order = 'YXZ';
    camera.rotation.set(0, 0, 0);

    const world = buildBuildingWorld(scene);

    // Lumière diffuse de nuit : gris chaud, sans dominante bleue.
    const moon = new THREE.DirectionalLight(0xd2c8b8, 0.34);
    moon.position.set(-35, 55, 25);
    moon.castShadow = true;
    moon.shadow.mapSize.set(1024, 1024);
    moon.shadow.camera.left = -45; moon.shadow.camera.right = 45;
    moon.shadow.camera.top = 45; moon.shadow.camera.bottom = -45;
    moon.shadow.camera.near = 1; moon.shadow.camera.far = 140;
    moon.shadow.bias = -0.0005;
    scene.add(moon);
    scene.add(new THREE.AmbientLight(0xaaa096, 0.43));
    const hemi = new THREE.HemisphereLight(0xc5beb3, 0x39332d, 0.35);
    scene.add(hemi);

    let jLx=0, jLy=0, jRx=0, jRy=0;
    function setupJoy(id, onMove) {
      const cv=document.getElementById(id);
      let active=false, baseX=0, baseY=0;
      function getPos(e) {
        const r=cv.getBoundingClientRect();
        const t=e.touches ? e.touches[0] : e;
        return {x:t.clientX-r.left, y:t.clientY-r.top};
      }
      function start(e) {
        e.preventDefault(); const p=getPos(e);
        baseX=p.x; baseY=p.y; active=true; onMove(0,0);
        if(e.type==='mousedown') {
          window.addEventListener('mousemove',move);
          window.addEventListener('mouseup',end);
        } else {
          window.addEventListener('touchmove',move,{passive:false});
          window.addEventListener('touchend',end);
          window.addEventListener('touchcancel',end);
        }
      }
      function move(e) {
        if(!active) return; e.preventDefault();
        const p=getPos(e); let dx=(p.x-baseX)/45, dy=(p.y-baseY)/22;
        const mag=Math.hypot(dx,dy);
        if(mag>1){dx/=mag;dy/=mag;}
        onMove(dx,dy);
      }
      function end() {
        if(!active)return; active=false; onMove(0,0);
        window.removeEventListener('mousemove',move);
        window.removeEventListener('mouseup',end);
        window.removeEventListener('touchmove',move);
        window.removeEventListener('touchend',end);
        window.removeEventListener('touchcancel',end);
      }
      cv.addEventListener('mousedown',start);
      cv.addEventListener('touchstart',start,{passive:false});
    }
    setupJoy('jL',(x,y)=>{jLx=x;jLy=y;});
    setupJoy('jR',(x,y)=>{jRx=x;jRy=y;});

    function drawJoy(id,dx,dy) {
      const cv=document.getElementById(id),ctx=cv.getContext('2d');
      const w=cv.width,h=cv.height;
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle='#302d29'; ctx.beginPath(); ctx.ellipse(w/2,h/2,56,26,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#655d53'; ctx.lineWidth=1.5; ctx.stroke();
      const x=w/2+dx*38,y=h/2+dy*16;
      const g=ctx.createRadialGradient(x-3,y-3,1,x,y,14);
      g.addColorStop(0,'#c0b7aa'); g.addColorStop(1,'#514b43');
      ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x,y,15,10,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#171614'; ctx.stroke();
    }

    let camYaw=0, camPitch=0, dragging=false, lastX=0,lastY=0;
    canvas.addEventListener('mousedown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;});
    document.addEventListener('mouseup',()=>dragging=false);
    document.addEventListener('mousemove',e=>{
      if(!dragging)return;
      camYaw-=(e.clientX-lastX)*0.004;
      camPitch-=(e.clientY-lastY)*0.003;
      camPitch=THREE.MathUtils.clamp(camPitch,-0.65,0.7);
      lastX=e.clientX;lastY=e.clientY;
    });
    canvas.addEventListener('touchstart',e=>{
      dragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;
    },{passive:true});
    canvas.addEventListener('touchend',()=>dragging=false,{passive:true});
    canvas.addEventListener('touchmove',e=>{
      if(!dragging)return;
      camYaw-=(e.touches[0].clientX-lastX)*0.004;
      camPitch-=(e.touches[0].clientY-lastY)*0.003;
      camPitch=THREE.MathUtils.clamp(camPitch,-0.65,0.7);
      lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;
    },{passive:true});

    let showCoords=false;
    window.toggleCoords=()=>{
      showCoords=!showCoords;
      document.getElementById('coordPanel').style.display=showCoords?'block':'none';
      document.getElementById('btnCoords').classList.toggle('active',showCoords);
    };
    window.copyCoords=()=>{
      const p=camera.position;
      const txt=`X:${p.x.toFixed(2)} Y:${p.y.toFixed(2)} Z:${p.z.toFixed(2)}`;
      const done=()=>{
        const toast=document.getElementById('toast');
        toast.textContent='✓ '+txt+' copied';toast.style.opacity='1';
        setTimeout(()=>toast.style.opacity='0',1800);
      };
      if(navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
      else fallbackCopy(txt,done);
    };
    function fallbackCopy(txt,done){
      const el=document.createElement('textarea');el.value=txt;document.body.appendChild(el);
      el.select();document.execCommand('copy');el.remove();done();
    }

    function resize(){
      const w=window.innerWidth,h=Math.max(1,window.innerHeight-70);
      renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
    }
    window.addEventListener('resize',resize);resize();

    const clock=new THREE.Clock();
    function loop(){
      const dt=Math.min(clock.getDelta(),0.05);
      camera.rotation.y=camYaw;camera.rotation.x=camPitch;
      const forward=new THREE.Vector3(-Math.sin(camYaw),0,-Math.cos(camYaw));
      const right=new THREE.Vector3(Math.cos(camYaw),0,-Math.sin(camYaw));
      const speed=6.5;
      const movement=new THREE.Vector3()
        .addScaledVector(forward,-jLy*speed*dt)
        .addScaledVector(right,jLx*speed*dt);
      camera.position.add(movement);
      camera.position.x=THREE.MathUtils.clamp(camera.position.x,-48,48);
      camera.position.z=THREE.MathUtils.clamp(camera.position.z,-90,35);
      camera.position.y=1.7;
      if(jRx!==0)camYaw-=jRx*0.12;
      if(jRy!==0)camPitch=THREE.MathUtils.clamp(camPitch-jRy*1.5*dt,-0.65,0.7);
      if(showCoords){
        document.getElementById('cx').textContent=camera.position.x.toFixed(2);
        document.getElementById('cz').textContent=camera.position.z.toFixed(2);
        document.getElementById('cy').textContent=camera.position.y.toFixed(2);
      }
      world.update?.(dt,clock.elapsedTime,camera.position);
      renderer.render(scene,camera);
      drawJoy('jL',jLx,jLy);drawJoy('jR',jRx,jRy);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
