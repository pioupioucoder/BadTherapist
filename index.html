<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<link rel="icon" type="image/png" href="/BadTherapist/images/logo.png?v=2">
<title>Bad Therapist</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<script src="save-data.js"></script>
<script src="loader.js"></script>
<script type="module" src="therapist-memory.js"></script>
<script src="audio-manager.js" defer></script>

<style>
:root {
    --black: #101010;
    --dark: #191919;
    --gray: #777;
    --light: #c9c9c9;
    --white: #ededed;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    background: var(--black);
    color: var(--white);
}

body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: 'VT323', monospace;
    position: relative;
}

.background {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at center, #292929 0%, #171717 48%, #090909 100%);
    z-index: 0;
}

.background::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .18;
    background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 32px 32px;
}

/* Transparent intro image */
.intro-art {
    position: fixed;
    z-index: 1;
    width: min(65vw, 650px);
    max-height: 75svh;
    object-fit: contain;
    object-position: center;
    opacity: .55;
    pointer-events: none;
    user-select: none;
    filter: drop-shadow(0 0 18px rgba(0,0,0,.5));
}

.scanlines {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    opacity: .12;
    background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,.65) 3px,
        rgba(0,0,0,.65) 4px
    );
}

.frame {
    position: fixed;
    inset: 15px;
    border: 1px solid rgba(255,255,255,.13);
    pointer-events: none;
    z-index: 2;
}

.frame::before,
.frame::after {
    content: "";
    position: absolute;
    width: 13px;
    height: 13px;
    border-color: #aaa;
    border-style: solid;
}

.frame::before {
    top: -1px;
    left: -1px;
    border-width: 2px 0 0 2px;
}

.frame::after {
    bottom: -1px;
    right: -1px;
    border-width: 0 2px 2px 0;
}

/* Main menu */
main {
    width: min(700px, 90%);
    text-align: center;
    position: relative;
    z-index: 3;
    padding: 40px 15px;
    animation: boot .9s ease-out both;
}

@keyframes boot {
    from {
        opacity: 0;
        transform: translateY(12px);
        filter: blur(3px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}

.menu-content {
    animation: floating 4s ease-in-out infinite;
}

@keyframes floating {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-9px);
    }
}

.system-label {
    font-size: 19px;
    letter-spacing: .24em;
    color: #858585;
    margin-bottom: 43px;
}

h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(27px, 6vw, 54px);
    line-height: 1.7;
    font-weight: normal;
    letter-spacing: -.07em;
    margin: 0 auto 52px;
    color: var(--white);
    text-shadow:
        3px 3px 0 #555,
        6px 6px 0 rgba(0,0,0,.8);
}

/* E glitch */
.glitch-e {
    display: inline-block;
    position: relative;
    animation: e-glitch 5s infinite steps(1);
}

.glitch-e::before,
.glitch-e::after {
    content: "E";
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
}

.glitch-e::before {
    color: #aaa;
    text-shadow: -3px 0 #fff;
    animation: e-glitch-before 5s infinite steps(1);
}

.glitch-e::after {
    color: #777;
    text-shadow: 3px 0 #ddd;
    animation: e-glitch-after 5s infinite steps(1);
}

@keyframes e-glitch {
    0%, 12%, 14%, 47%, 49%, 100% {
        transform: translate(0);
        opacity: 1;
        filter: none;
    }
    13% {
        transform: translate(3px, -2px) skewX(-12deg);
        opacity: .55;
        filter: blur(1px);
    }
    48% {
        transform: translate(-2px, 1px) scaleY(.8);
        opacity: .7;
        filter: blur(.5px);
    }
}

@keyframes e-glitch-before {
    0%, 12%, 14%, 47%, 49%, 100% {
        opacity: 0;
        transform: translate(0);
    }
    13% {
        opacity: .8;
        transform: translate(-4px, 1px);
    }
    48% {
        opacity: .6;
        transform: translate(3px, -2px);
    }
}

@keyframes e-glitch-after {
    0%, 12%, 14%, 47%, 49%, 100% {
        opacity: 0;
        transform: translate(0);
    }
    13% {
        opacity: .7;
        transform: translate(4px, -1px);
    }
    48% {
        opacity: .8;
        transform: translate(-3px, 2px);
    }
}

.divider {
    width: 180px;
    height: 4px;
    background: #777;
    margin: 0 auto 37px;
    box-shadow:
        0 5px 0 #333,
        0 -5px 0 #333;
}

nav {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 17px;
}

nav a {
    width: 245px;
    padding: 15px 12px;
    text-decoration: none;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: #aaa;
    background: #171717;
    border: 2px solid #555;
    box-shadow: 4px 4px 0 #050505;
    transition: .15s ease;
    position: relative;
}

nav a:hover {
    color: #fff;
    background: #353535;
    border-color: #ddd;
    transform: translate(-2px,-2px);
    box-shadow: 6px 6px 0 #050505;
}

nav a:active {
    transform: translate(3px,3px);
    box-shadow: 1px 1px 0 #050505;
}

nav a::before {
    content: "▶";
    position: absolute;
    left: 15px;
    opacity: 0;
    transition: .15s;
    font-size: 10px;
}

nav a:hover::before {
    opacity: 1;
}

/* Entry question */
#entry-screen {
    position: fixed;
    inset: 0;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px;
    text-align: center;
    background: transparent;
    animation: entry-appear .8s ease both;
}

@keyframes entry-appear {
    from {
        opacity: 0;
        filter: blur(4px);
    }
    to {
        opacity: 1;
        filter: blur(0);
    }
}

#entry-screen.hidden {
    display: none;
}

.entry-question {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(15px, 3vw, 23px);
    line-height: 1.9;
    max-width: 600px;
    margin-bottom: 38px;
    text-shadow: 3px 3px 0 #333;
}

.entry-buttons {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
}

.entry-buttons button {
    width: 150px;
    padding: 15px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: #aaa;
    background: #171717;
    border: 2px solid #555;
    box-shadow: 4px 4px 0 #050505;
    cursor: pointer;
    transition: .15s ease;
}

.entry-buttons button:hover {
    color: #fff;
    background: #353535;
    border-color: #ddd;
    transform: translate(-2px,-2px);
}

.entry-buttons button:active {
    transform: translate(2px,2px);
}

/* Hidden until entry is accepted */
#game-menu.hidden {
    display: none;
}

@media(max-width:480px) {
    h1 {
        font-size: clamp(22px, 7vw, 34px);
    }

    .system-label {
        font-size: 16px;
    }

    nav a {
        width: min(245px, 85vw);
    }

    .intro-art {
        width: 90vw;
        max-height: 65svh;
    }

    .entry-buttons button {
        width: 125px;
    }
}

/* Admin : un petit œil pixel, presque invisible, qui suit le curseur */
.admin-eye {
    position: fixed;
    left: 14px;
    bottom: 14px;
    z-index: 8;
    width: 46px;
    height: 46px;
    padding: 0;
    display: grid;
    place-items: center;
    background: none;
    border: 0;
    color: #8f8f8f;
    opacity: .12;
    cursor: pointer;
    transition: opacity .5s ease, color .5s ease;
    -webkit-tap-highlight-color: transparent;
}

.admin-eye svg { display: block; overflow: visible; }
.admin-eye .iris-a { fill: #ededed; }
.admin-eye .iris-b { fill: #101010; }
.eye-lid { opacity: 0; }

.admin-eye:hover,
.admin-eye:focus-visible {
    opacity: .95;
    color: #d6d6d6;
    outline: none;
}

.admin-eye:hover .iris-a,
.admin-eye:focus-visible .iris-a { fill: #b3262e; }

/* Mode admin actif : l'œil reste visible et devient bleu.
   Au survol, il prend l'aspect « joueur » (blanc) : un clic bascule vers le mode joueur. */
.admin-eye.on { opacity: .95; color: #7fa8ff; }
.admin-eye.on .iris-a { fill: #3b82f6; }
.admin-eye.on:hover,
.admin-eye.on:focus-visible { color: #d6d6d6; }
.admin-eye.on:hover .iris-a,
.admin-eye.on:focus-visible .iris-a { fill: #ededed; }

.admin-eye.blink .eye-iris { opacity: 0; }
.admin-eye.blink .eye-lid { opacity: 1; }

/* Fenêtre admin */
.admin-modal {
    position: fixed;
    inset: 0;
    z-index: 9;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.82);
}

.admin-modal.hidden { display: none; }

.admin-box {
    width: min(480px, 100%);
    padding: 24px 22px 22px;
    background: #171717;
    border: 2px solid #555;
    box-shadow: 4px 4px 0 #050505;
    text-align: center;
}

.admin-title {
    margin: 0 0 18px;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    letter-spacing: .1em;
    color: #b3262e;
}

.admin-text {
    margin: 0 0 24px;
    font-size: 22px;
    line-height: 1.15;
    color: var(--light);
}

.admin-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.admin-buttons button {
    padding: 13px 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #aaa;
    background: #171717;
    border: 2px solid #555;
    box-shadow: 3px 3px 0 #050505;
    cursor: pointer;
    transition: .15s ease;
}

.admin-buttons button:hover,
.admin-buttons button:focus-visible {
    color: #fff;
    background: #353535;
    border-color: #ddd;
    outline: none;
}

@media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="background"></div>

<img
    class="intro-art"
    src="images/intro.png"
    alt=""
    draggable="false"
>

<div class="frame"></div>
<div class="scanlines"></div>

<audio id="intro-music" src="audio/intro.mp3" loop preload="auto"></audio>

<!-- First screen -->
<section id="entry-screen">
    <p class="entry-question">Do you wanna waste your time?</p>

    <div class="entry-buttons">
        <button id="yes-button" type="button">YES</button>
        <button id="no-button" type="button">NO</button>
    </div>
</section>

<!-- Main menu -->
<main id="game-menu" class="hidden">
    <div class="menu-content">

        <h1>BAD<br>TH<span class="glitch-e">E</span>RAPIST</h1>

        <div class="divider"></div>

        <nav>
            <a id="play-link" href="world_base.html?launch=1">PLAY</a>
            <a href="settings.html">SETTINGS</a>
        </nav>

    </div>
</main>

<!-- Admin : tout petit œil en bas à gauche -->
<button id="admin-eye" class="admin-eye" type="button" aria-label="Admin">
    <svg viewBox="0 0 13 7" width="26" height="14" shape-rendering="crispEdges" aria-hidden="true">
        <path fill="currentColor" d="M4 0h5v1H4zM2 1h2v1H2zM9 1h2v1H9zM1 2h1v1H1zM11 2h1v1h-1zM0 3h1v1H0zM12 3h1v1h-1zM1 4h1v1H1zM11 4h1v1h-1zM2 5h2v1H2zM9 5h2v1H9zM4 6h5v1H4z"/>
        <g class="eye-iris" id="eye-iris">
            <rect class="iris-a" x="5" y="2" width="3" height="3"/>
            <rect class="iris-b" x="6" y="3" width="1" height="1"/>
        </g>
        <path class="eye-lid" fill="currentColor" d="M1 3h11v1H1z"/>
    </svg>
</button>

<div id="admin-modal" class="admin-modal hidden" role="dialog" aria-modal="true" aria-labelledby="admin-title">
    <div class="admin-box">
        <p id="admin-title" class="admin-title">ADMIN</p>
        <p id="admin-text" class="admin-text"></p>
        <div id="admin-buttons" class="admin-buttons"></div>
    </div>
</div>


<script>
(() => {
    const entryScreen = document.getElementById('entry-screen');
    const gameMenu = document.getElementById('game-menu');
    const yesButton = document.getElementById('yes-button');
    const noButton = document.getElementById('no-button');

    const ACCEPTED_KEY = 'bt_intro_accepted';

    function showMenu() {
        entryScreen.classList.add('hidden');
        gameMenu.classList.remove('hidden');
    }

    // If the player already accepted during this tab session,
    // return directly to the menu.
    if (sessionStorage.getItem(ACCEPTED_KEY) === '1') {
        showMenu();
    }

    yesButton.addEventListener('click', () => {
        sessionStorage.setItem(ACCEPTED_KEY, '1');

        showMenu();

        if (window.BadTherapistAudio) {
            window.BadTherapistAudio.start();
        }
    });

    noButton.addEventListener('click', () => {
        if (window.BadTherapistAudio) {
            window.BadTherapistAudio.stop();
        }

        sessionStorage.removeItem(ACCEPTED_KEY);
        window.location.href = 'https://krismeow.straw.page/';
    });

    // PLAY : écran de chargement pixel + préchargement de tous les fichiers du site, puis le jeu
    document.getElementById('play-link').addEventListener('click', (e) => {
        if (!window.BTGo) return;                 // loader.js absent : le lien marche comme avant
        e.preventDefault();
        window.BTGo(e.currentTarget.getAttribute('href'));
    });
})();
</script>

<script>
// Icône admin : lance le jeu avec TA progression (json/bad-therapist-save.json poussé,
// + ce qui est déjà dans ce navigateur et pas encore exporté). Le bouton PLAY, lui, ne touche à rien.
(() => {
    const Save = window.BadTherapistSave;
    const eye = document.getElementById('admin-eye');

    if (!Save) {
        // save-data.js introuvable : on cache l'œil, le reste de la page marche comme avant
        console.error('save-data.js not found: put it in the same folder as index.html.');
        eye.style.display = 'none';
        return;
    }

    const iris = document.getElementById('eye-iris');
    const modal = document.getElementById('admin-modal');
    const modalText = document.getElementById('admin-text');
    const modalButtons = document.getElementById('admin-buttons');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ── L'œil regarde le curseur (pixels entiers, pour rester net) ──
    function look(dx, dy) {
        dx = Math.max(-2, Math.min(2, Math.round(dx)));
        dy = Math.max(-1, Math.min(1, Math.round(dy)));
        if (dy !== 0) dx = Math.max(-1, Math.min(1, dx));   // reste bien dans l'œil
        iris.setAttribute('transform', 'translate(' + dx + ' ' + dy + ')');
    }

    let lastMove = 0;

    window.addEventListener('pointermove', (e) => {
        lastMove = performance.now();
        const r = eye.getBoundingClientRect();
        const ax = e.clientX - (r.left + r.width / 2);
        const ay = e.clientY - (r.top + r.height / 2);
        const d = Math.hypot(ax, ay) || 1;
        look(ax / d * 2.4, ay / d * 1.4);
    }, { passive: true });

    // Quand personne ne bouge : il regarde ailleurs de temps en temps, et cligne
    if (!reduceMotion) {
        setInterval(() => {
            if (performance.now() - lastMove > 3500) look(Math.random() * 5 - 2.5, Math.random() * 3 - 1.5);
        }, 2600);

        (function blinkLater() {
            setTimeout(() => {
                eye.classList.add('blink');
                setTimeout(() => eye.classList.remove('blink'), 150);
                blinkLater();
            }, 3500 + Math.random() * 6000);
        })();
    }

    // ── Fenêtre de choix ──
    function openModal(text, buttons) {
        modalText.textContent = text;
        modalButtons.textContent = '';
        buttons.forEach((b) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = b.label;
            btn.addEventListener('click', () => { closeModal(); b.action(); });
            modalButtons.appendChild(btn);
        });
        modal.classList.remove('hidden');
        modalButtons.firstChild.focus();
    }

    function closeModal() {
        modal.classList.add('hidden');
        eye.classList.remove('blink');
        busy = false;
    }

    modal.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    // ── Entrer dans le jeu (comme après YES puis PLAY) ──
    function enterGame() {
        sessionStorage.setItem('bt_intro_accepted', '1');
        if (window.BadTherapistAudio) window.BadTherapistAudio.start();
        if (window.BTGo) window.BTGo('world_base.html?launch=1'); else window.location.href = 'world_base.html?launch=1';
    }

    // Œil bleu = mode admin actif, œil gris = mode joueur. PLAY, EXPORT, IMPORT et RESET agissent sur le mode actif.
    function refreshEye() {
        Save.syncMode();
        const admin = Save.activeProfile() === 'admin';
        eye.classList.toggle('on', admin);
        eye.setAttribute('aria-pressed', admin ? 'true' : 'false');
        eye.title = admin ? 'ADMIN mode: click to switch to PLAYER' : '';
        eye.setAttribute('aria-label', admin ? 'Switch to player mode' : 'Admin');
    }
    refreshEye();
    window.addEventListener('pageshow', refreshEye);   // retour du jeu avec le bouton « précédent »

    let busy = false;

    // Premier clic sur l'œil : mode admin + lancement du jeu
    eye.addEventListener('click', async () => {
        if (busy) return;
        try {
            await onEyeClick();
        } catch (err) {                                 // jamais bloqué pour toujours : on libère l'œil et on le dit dans la console
            console.error('[admin eye]', err);
            busy = false;
            eye.classList.remove('blink');
        }
    });

    async function onEyeClick() {
        // Déjà en mode admin (œil bleu) : un clic remet le mode joueur. Ta sauvegarde admin est mise de côté, intacte.
        if (Save.activeProfile() === 'admin') {
            Save.switchTo('player');
            refreshEye();
            return;
        }

        busy = true;
        eye.classList.add('blink');                 // l'œil se ferme pendant qu'on cherche ta sauvegarde

        // Rien en local mais synchro cloud disponible (nouvel appareil, navigation privée) : connexion Google, puis chargement du cloud
        if (typeof Save.syncAvailable === 'function' && Save.syncAvailable() && !Save.hasProgress('admin')) {
            const st = await Save.syncStatus();
            const notFound = (text) => openModal(text, [{ label: 'OK', action: () => {} }]);

            if (st.user) {
                const res = await Save.syncPull();
                if (res.ok && !res.empty) { Save.switchTo('admin'); return enterGame(); }
                // cloud vide ou erreur : on continue avec l'ancien chemin ci-dessous
            } else {
                return openModal('No admin save in this browser. Sign in with Google to load your cloud save.', [
                    { label: 'SIGN IN WITH GOOGLE', action: async () => {
                        const r = await Save.syncSignIn();
                        if (r.redirect) { Save.switchTo('admin'); return; }   // téléphone : la page revient connectée et charge le cloud
                        if (!r.ok) return notFound('Sign-in failed (' + r.error + ').');
                        const res = await Save.syncPull();
                        if (res.ok && !res.empty) { Save.switchTo('admin'); return enterGame(); }
                        notFound(res.ok ? 'Signed in, but the cloud save is empty.' : 'Cloud sync failed (' + res.error + ').');
                    } },
                    { label: 'CANCEL', action: () => {} }
                ]);
            }
        }

        const pushed = await Save.fetchPushed();
        const plan = Save.adminPlan(pushed);

        if (plan === 'continue') {
            Save.switchTo('admin');
            return enterGame();
        }

        if (plan === 'load') {
            Save.switchTo('admin');
            Save.apply(pushed);
            Save.markAdminClean();
            return enterGame();
        }

        if (plan === 'adopt') {
            return openModal("No pushed save yet. Use the game in progress in this browser as your admin save? PLAY will then start from zero.", [
                { label: 'USE CURRENT GAME', action: () => { Save.adoptAsAdmin(); enterGame(); } },
                { label: 'CANCEL', action: () => {} }
            ]);
        }

        if (plan === 'missing') {
            return openModal('No admin save found. Export your save in Settings, put the file in the json folder, then push it.', [
                { label: 'OK', action: () => {} }
            ]);
        }
    }
})();
</script>

</body>
</html>
