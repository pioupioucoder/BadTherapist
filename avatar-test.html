<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Test avatars</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#101018;color:#eee;font-family:monospace;overflow:hidden}
  #ui{position:fixed;left:10px;top:10px;z-index:2;max-width:min(560px,92vw);font-size:13px;line-height:1.5}
  #top{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  #top select, #top button{background:#222;color:#eee;border:1px solid #888;padding:6px 10px;font-family:inherit;font-size:14px;cursor:pointer}
  #top select:focus{outline:1px solid #8cf}
  #btns{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:8px}
  #btns button{background:#222;color:#eee;border:1px solid #888;padding:5px 9px;cursor:pointer;font-family:inherit;font-size:12px}
  #btns button.on{background:#eee;color:#000;font-weight:bold}
  #btns button:hover{border-color:#8cf}
  #log{white-space:pre-wrap;color:#9fd;max-height:40vh;overflow:auto;background:rgba(0,0,0,0.3);padding:6px;border-radius:4px}
  #log.err{color:#f88}
  #hint{color:#667;font-size:11px;margin-top:6px}
  canvas{display:block}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <div id="top">
    <label>Avatar :</label>
    <select id="avatarSelect"><option>Chargement...</option></select>
    <button id="reloadBtn" title="Recharger l'avatar actuel">↻ Recharger</button>
  </div>
  <div id="btns"></div>
  <div id="log"></div>
  <div id="hint">Dossiers détectés automatiquement via PHP dans <code>avatars/</code>.</div>
</div>
<script type="module">
import * as THREE from 'three';
import { loadMixamoAvatar } from './avatar-loader.js';

const logEl = document.getElementById('log');
const say = (t, err) => { logEl.textContent = t; logEl.className = err ? 'err' : ''; };

// --- SCÈNE THREE ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101018);
scene.add(new THREE.HemisphereLight(0xffffff, 0x333344, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(2, 4, 3);
scene.add(sun);
scene.add(new THREE.GridHelper(6, 12, 0x555577, 0x2a2a3a));

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 100);
let yaw = 0.3, pitch = 0.15, dist = 3.2;
const target = new THREE.Vector3(0, 1.0, 0);
function placeCamera() {
  camera.position.set(
    target.x + dist * Math.sin(yaw) * Math.cos(pitch),
    target.y + dist * Math.sin(pitch),
    target.z + dist * Math.cos(yaw) * Math.cos(pitch));
  camera.lookAt(target);
}
placeCamera();

let drag = false, lx = 0, ly = 0;
addEventListener('pointerdown', e => { if (e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT') return; drag = true; lx = e.clientX; ly = e.clientY; });
addEventListener('pointerup', () => drag = false);
addEventListener('pointermove', e => {
  if (!drag) return;
  yaw -= (e.clientX - lx) * 0.01; pitch = Math.max(-0.6, Math.min(1.2, pitch + (e.clientY - ly) * 0.01));
  lx = e.clientX; ly = e.clientY; placeCamera();
});
addEventListener('wheel', e => { dist = Math.max(1, Math.min(10, dist + e.deltaY * 0.004)); placeCamera(); });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// --- ÉTAT ---
let AVATARS = {}; // Sera rempli par avatars.php
let current = null;
let loadToken = 0;
const clock = new THREE.Clock();

(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.1);
  if (current && current.avatar && current.avatar.update) {
    try { current.avatar.update(dt); } catch (e) { /* ignore */ }
  }
  renderer.render(scene, camera);
})();

function disposeObject(obj) {
  obj.traverse(child => {
    if (child.geometry) child.geometry.dispose();
    if (child.material) {
      const mats = Array.isArray(child.material) ? child.material : [child.material];
      mats.forEach(m => {
        for (const k in m) { if (m[k] && m[k].isTexture) m[k].dispose(); }
        m.dispose();
      });
    }
  });
}

// --- CHARGEMENT D'UN AVATAR ---
async function loadAvatar(id) {
  const cfg = AVATARS[id];
  if (!cfg) return;
  const myToken = ++loadToken;

  if (current && current.avatar && current.avatar.root) {
    scene.remove(current.avatar.root);
    disposeObject(current.avatar.root);
  }
  current = null;
  document.getElementById('btns').textContent = '';
  say('Chargement de ' + id + '...');

  const animationsMap = {};
  for (const file of cfg.animations) {
    const animName = file.replace(/\.fbx$/i, '');
    animationsMap[animName] = cfg.dir + file;
  }

  try {
    const av = await loadMixamoAvatar({
      model: cfg.dir + cfg.model,
      textures: {
        map: cfg.dir + 'texture_diffuse.png',
        normalMap: cfg.dir + 'texture_normal.png',
        roughnessMap: cfg.dir + 'texture_roughness.png',
        metalnessMap: cfg.dir + 'texture_metallic.png'
      },
      animations: animationsMap,
      height: 1.75,             // hauteur par défaut si non précisée
      modelAnimation: 'idle'
    });

    if (myToken !== loadToken) { if (av.root) disposeObject(av.root); return; }

    scene.add(av.root);
    current = { id, avatar: av, playing: null };

    const names = Object.keys(av.actions || {});
    const lines = ['Avatar : ' + id + ' — Animations : ' + names.length];
    names.forEach(n => lines.push(' ✓ ' + n));
    say(lines.join('\n'));

    buildAnimButtons(av, names);
    const first = names.includes('idle') ? 'idle' : names[0];
    if (first) playAnim(av, first);

  } catch (e) {
    if (myToken !== loadToken) return;
    say('Erreur : ' + (e && e.message ? e.message : e), true);
    console.error(e);
  }
}

function buildAnimButtons(av, names) {
  const box = document.getElementById('btns');
  box.textContent = '';
  names.forEach(n => {
    const b = document.createElement('button');
    b.textContent = n; b.dataset.anim = n;
    b.onclick = () => playAnim(av, n);
    box.appendChild(b);
  });
}

function playAnim(av, name) {
  try {
    av.play(name);
    if (current) current.playing = name;
    document.querySelectorAll('#btns button').forEach(b => {
      b.classList.toggle('on', b.dataset.anim === name);
    });
  } catch (e) {
    say('Impossible de jouer « ' + name + ' »', true);
  }
}

// --- INITIALISATION (Récupération via PHP) ---
async function init() {
  try {
    say('Analyse du dossier /avatars/ via PHP...');
    const res = await fetch('avatars.php');
    if (!res.ok) throw new Error('avatars.php introuvable ou erreur serveur');
    const data = await res.json();

    for (const dirName in data) {
      const info = data[dirName];
      AVATARS[dirName] = {
        dir: 'avatars/' + dirName + '/',
        model: info.model,
        animations: info.animations
      };
    }

    const select = document.getElementById('avatarSelect');
    select.innerHTML = '';
    
    const keys = Object.keys(AVATARS);
    if (keys.length === 0) {
      say('Aucun dossier d\'avatar valide trouvé dans /avatars/ (il faut au moins un fichier .fbx portant le même nom que le dossier).', true);
      return;
    }

    for (const id of keys) {
      const opt = document.createElement('option');
      opt.value = id; opt.textContent = id;
      select.appendChild(opt);
    }

    select.onchange = () => loadAvatar(select.value);
    document.getElementById('reloadBtn').onclick = () => loadAvatar(select.value);

    loadAvatar(select.value);

  } catch (e) {
    say('Erreur fatale : ' + e.message + '\nEs-tu bien sur un serveur PHP (http://localhost/...) ?', true);
  }
}

init();
</script>
</body>
</html>
